<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulas — Part 2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ════════════════════════════════════════════════
       Match the DSA Revisor (problem) palette:
       Darcula slate base × Claude-orange accent
       ════════════════════════════════════════════════ */
    :root {
      --bg:            #1e1f22 !important;
      --bg-card:       #2b2d30 !important;
      --bg-card-hover: #393b40 !important;
      --bg-elevated:   #2b2d30 !important;
      --border:        #393b40 !important;
      --text:          #dfe1e5 !important;
      --text-body:     #bcbec4 !important;
      --text-muted:    #7c7d80 !important;
      --blue:   #4eade5 !important;
      --green:  #6aab73 !important;
      --red:    #cf5b56 !important;
      --purple: #c77dbb !important;
      --amber:  #d6bd72 !important;
      --orange: #cc7832 !important;
      --teal:   #56a8f5 !important;
      --accent:        #d97757;
      --accent-soft:   rgba(217,119,87,0.12);
      --accent-border: rgba(217,119,87,0.40);
    }
    body { background: var(--bg); color: var(--text-body); }

    /* ════════════════════════════════════════════════
       FORMULAS PAGE — dedicated typography & layout
       ════════════════════════════════════════════════ */

    /* Override .sec spacing for breathable category headings */
    main .sec { margin-bottom: 56px; }
    .sec-title {
      font-size: 11px !important;
      letter-spacing: 2.4px !important;
      text-transform: uppercase !important;
      color: var(--amber) !important;
      font-weight: 700 !important;
      padding-bottom: 12px !important;
      border-bottom: 2px solid var(--border) !important;
      margin-bottom: 22px !important;
      position: relative;
    }
    .sec-title::before {
      content: 'ƒ';
      font-family: 'Inter', sans-serif;
      font-style: italic;
      font-weight: 600;
      color: var(--amber);
      margin-right: 10px;
      font-size: 18px;
      vertical-align: -2px;
      opacity: 0.7;
    }

    /* Override .pat-card to a formula-friendly layout */
    main .pat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
    }
    main .pat-card:hover {
      border-color: rgba(210, 153, 34, 0.45);
    }
    main .pat-hdr {
      padding: 14px 22px !important;
      background: linear-gradient(180deg, rgba(210, 153, 34, 0.06), transparent) !important;
      border-bottom: 1px solid var(--border) !important;
      border-left: 3px solid var(--amber) !important;
    }
    main .pat-hdr-name {
      font-size: 16px !important;
      font-weight: 600 !important;
      color: var(--text) !important;
      letter-spacing: -0.1px !important;
    }
    main .pat-day {
      font-size: 10.5px !important;
      letter-spacing: 0.8px !important;
      color: var(--amber) !important;
      background: rgba(210, 153, 34, 0.10) !important;
      border: 1px solid rgba(210, 153, 34, 0.30) !important;
    }
    main .pat-body { padding: 22px 24px !important; }
    main .pat-cols {
      grid-template-columns: 1.4fr 1fr !important;
      gap: 28px !important;
    }
    @media (max-width: 820px) {
      main .pat-cols { grid-template-columns: 1fr !important; }
    }

    /* ── Equation block — the star of the show ── */
    .formula-eq {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px 24px;
      margin: 0 0 14px 0;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 14.5px;
      color: var(--text);
      line-height: 2.0;
      letter-spacing: 0.2px;
      position: relative;
      overflow-x: auto;
    }
    .formula-eq::before {
      content: '≡';
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 14px;
      color: rgba(210, 153, 34, 0.4);
      font-family: 'Inter', sans-serif;
    }
    .formula-eq .var { color: #79c0ff; font-style: italic; }
    .formula-eq .op  { color: #ff7b72; font-weight: 600; }
    .formula-eq .num { color: #d2a8ff; }
    .formula-eq .com {
      color: #6e7681;
      font-style: italic;
      font-size: 12.5px;
    }

    /* ── Example pill ── */
    .mini-ex {
      background: rgba(63, 185, 80, 0.06);
      border: 1px solid rgba(63, 185, 80, 0.20);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 0;
      font-size: 13px;
      color: var(--text-body);
      line-height: 1.7;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .mini-ex::before {
      content: '▸';
      color: var(--green);
      font-size: 14px;
      flex-shrink: 0;
      line-height: 1.5;
    }
    .mini-ex strong {
      color: var(--green);
      font-weight: 600;
    }

    /* ── Signals list — cleaner bullets ── */
    .sig-label {
      font-size: 10px !important;
      letter-spacing: 1.8px !important;
      color: var(--text-muted) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      display: block;
      margin-bottom: 10px;
    }
    .sig-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }
    .sig-list li {
      font-size: 13px !important;
      color: var(--text-body) !important;
      padding: 6px 0 6px 22px !important;
      line-height: 1.6 !important;
      position: relative;
      border-bottom: 1px dashed rgba(48,54,61,0.5) !important;
    }
    .sig-list li:last-child { border-bottom: none !important; }
    .sig-list li::before {
      content: '◆' !important;
      position: absolute;
      left: 4px;
      top: 6px;
      color: var(--amber) !important;
      font-size: 9px !important;
      line-height: 1.8;
    }

    /* ── Used-in pill row ── */
    .used-row {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .used-row .lbl {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--text-muted);
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
    }
    .used-in {
      display: inline-flex;
      align-items: center;
      background: rgba(188, 140, 255, 0.08);
      border: 1px solid rgba(188, 140, 255, 0.25);
      color: var(--purple);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      margin: 3px 4px 3px 0;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.2px;
      transition: all 0.15s;
    }
    .used-in:hover {
      background: rgba(188, 140, 255, 0.16);
      border-color: var(--purple);
    }

    /* ── Bottom gotcha note ── */
    .pat-note {
      font-size: 12.5px !important;
      color: var(--text-muted) !important;
      line-height: 1.7 !important;
      margin-top: 18px !important;
      padding: 12px 16px !important;
      background: rgba(248, 81, 73, 0.04) !important;
      border-radius: 8px !important;
      border-left: 3px solid rgba(248, 81, 73, 0.4) !important;
    }
    .pat-note::before {
      content: '⚠ ';
      color: var(--red);
      font-size: 13px;
      margin-right: 4px;
    }
    .pat-note code {
      background: rgba(110, 118, 129, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
    }

    /* Top intro note styling */
    main > .note {
      background: rgba(210, 153, 34, 0.06);
      border-left: 3px solid var(--amber);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-body);
      margin-bottom: 36px;
      line-height: 1.65;
    }
    main > .page-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text);
      margin-bottom: 6px;
    }
    main > .page-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* ===== Revision controls ===== */
    .toolbar{background:var(--bg);padding:0 0 12px;margin-bottom:18px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .search-box{flex:1;min-width:220px;position:relative}
    .search-box input{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px 14px 10px 36px;color:var(--text);font-size:14px;outline:none}
    .search-box input:focus{border-color:var(--amber)}
    .search-box::before{content:'\2315';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px}
    .seg{display:inline-flex;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .seg button{background:transparent;border:none;color:var(--text-muted);padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.3px}
    .seg button.active{background:var(--accent);color:#1a1205}
    .count-pill{font-size:12px;color:var(--text-muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
    .chip{background:var(--bg-card);border:1px solid var(--border);color:var(--text-body);padding:6px 13px;border-radius:999px;font-size:12px;cursor:pointer;transition:all .15s}
    .chip:hover{border-color:var(--accent)}
    .chip.active{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent);font-weight:600}

    /* ===== Section / Topic taxonomy headers (mirrors problem grouping) ===== */
    .tax-section{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text);font-weight:800;margin:38px 0 18px;display:flex;align-items:center;gap:12px}
    .tax-section:first-child{margin-top:4px}
    .tax-section::after{content:'';flex:1;height:2px;background:var(--border)}
    .tax-topic{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .tax-topic .tcount{font-size:9px;letter-spacing:.5px;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);padding:1px 7px;border-radius:999px;font-weight:600}

    /* ===== Cheatsheet ===== */
    .cheat-group{margin-bottom:30px}
    .cheat-cat{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .cheat-row{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
    .cheat-row:hover{border-color:rgba(210,153,34,.45)}
    .cheat-top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:7px}
    .cheat-name{font-size:14px;font-weight:600;color:var(--text)}
    .cheat-name .twist{color:var(--text-muted);font-size:10px;margin-right:8px;display:inline-block;transition:transform .15s}
    .cheat-day{font-size:10px;letter-spacing:.6px;color:var(--amber);background:rgba(210,153,34,.10);border:1px solid rgba(210,153,34,.3);padding:2px 8px;border-radius:6px;white-space:nowrap}
    .cheat-eq{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:12.5px;color:var(--text-body);line-height:1.9;overflow-x:auto}
    .cheat-eq .var{color:#79c0ff;font-style:italic}.cheat-eq .op{color:#ff7b72;font-weight:600}.cheat-eq .num{color:#d2a8ff}.cheat-eq .com{color:#6e7681;font-style:italic;font-size:11.5px}
    .cheat-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
    .cheat-row.open .cheat-detail{display:block}
    .cheat-row.open .twist{transform:rotate(90deg)}

    /* ===== Flashcards ===== */
    .flash-wrap{max-width:680px;margin:10px auto 0}
    .flash-progress{text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:14px;letter-spacing:.4px}
    .flash-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:30px 28px;min-height:260px}
    .flash-cat{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);font-weight:700}
    .flash-name{font-size:22px;font-weight:700;color:var(--text);margin:8px 0 20px;letter-spacing:-.3px;line-height:1.3}
    .flash-q{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:8px}
    .flash-back{margin-top:22px;padding-top:22px;border-top:1px solid var(--border)}
    .flash-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
    .fbtn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
    .fbtn:hover{border-color:var(--accent)}
    .fbtn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent)}
    .hint{text-align:center;color:var(--text-muted);font-size:11px;margin-top:14px}
    .empty{text-align:center;color:var(--text-muted);padding:50px 20px;font-size:14px}
  </style>
</head>

<main>
  <div class="page-title">Formulas &amp; Identities</div>
  <div class="page-sub">Grouped by <strong>Section &rarr; Topic</strong>, same as the problem list. Use <strong>Flashcards</strong> to actively recall a formula before revealing it.</div>

  <div class="toolbar">
    <div class="search-box"><input id="search" type="text" placeholder="Search name, formula, day, problem id…" autocomplete="off"></div>
    <div class="seg" id="modeSeg">
      <button data-mode="cheat" class="active">Cheatsheet</button>

    </div>

  </div>

<!-- Data as a sibling script: resolves regardless of server root and works under file://. -->
<script src="formulas.data.js"></script>
<script>
const $ = s => document.querySelector(s);
let DATA = {taxonomy:[], formulas:[]};
let mode='cheat', activeTopic='All', query='';
let flashIdx=0, flashRevealed=false, flashPool=[];
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stripTags = s => (s||'').replace(/<[^>]+>/g,'');

function dataCandidates(){
  const out=[];
  const p=location.pathname;
  const i=p.indexOf('/Revise/');
  if(i>=0) out.push(p.slice(0,i)+'/Revise/data/formulas.json');  // absolute, root-independent
  out.push('../data/formulas.json','data/formulas.json','./data/formulas.json');
  return [...new Set(out)];
}
function applyData(d){DATA=d;buildChips();bindControls();render();}
async function loadFormulas(){
  if(window.FORMULAS_DATA){applyData(window.FORMULAS_DATA);return;}  // sibling script (preferred)
  let lastErr='';
  for(const url of dataCandidates()){
    try{
      const r=await fetch(url);
      if(!r.ok){lastErr='HTTP '+r.status+' for '+url;continue;}
      applyData(await r.json());return;  // throws if HTML/invalid
    }catch(e){lastErr=String(e);}
  }
  $('#view').innerHTML='<div class="empty">Could not load formulas data &mdash; '+esc(lastErr)+'</div>';
}
loadFormulas();

function filtered(){
  const q=query.trim().toLowerCase();
  return DATA.formulas.filter(f=>{
    if(activeTopic!=='All' && f.topic!==activeTopic) return false;
    if(!q) return true;
    const hay=[f.name,f.section,f.topic,f.day,stripTags(f.formula),stripTags(f.example),
      (f.whenToUse||[]).join(' '),(f.usedIn||[]).join(' '),stripTags(f.note)].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
// Group a list into [{section, topic, items}] following DATA.taxonomy order.
function groupByTaxonomy(list){
  return (DATA.taxonomy||[]).map(t=>({
    section:t.section, topic:t.topic,
    items:list.filter(f=>f.section===t.section && f.topic===t.topic)
  })).filter(g=>g.items.length);
}
// Render grouped HTML with Section banners + Topic headings; per-group body via bodyFn(items).
function renderGroups(list, bodyFn){
  let html='', lastSection=null;
  groupByTaxonomy(list).forEach(g=>{
    if(g.section!==lastSection){ html+=`<div class="tax-section">${esc(g.section)}</div>`; lastSection=g.section; }
    html+=`<div class="cheat-group"><div class="tax-topic">${esc(g.topic)}<span class="tcount">${g.items.length}</span></div>${bodyFn(g.items)}</div>`;
  });
  return html;
}
function buildChips(){
  const topics=['All',...(DATA.taxonomy||[]).map(t=>t.topic)];
  $('#chips').innerHTML=topics.map(t=>`<span class="chip${t===activeTopic?' active':''}" data-topic="${esc(t)}">${esc(t)}</span>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{activeTopic=ch.dataset.topic;flashIdx=0;flashRevealed=false;buildChips();render();});
}
function bindControls(){
  $('#search').oninput=e=>{query=e.target.value;flashIdx=0;flashRevealed=false;render();};
  $('#modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;flashIdx=0;flashRevealed=false;
    $('#modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render();});
  document.addEventListener('keydown',e=>{
    if(mode!=='flash'||e.target.tagName==='INPUT') return;
    if(e.code==='Space'){e.preventDefault(); if(!flashRevealed){flashRevealed=true;renderFlashCard();}else{flashNext();}}
    else if(e.key==='ArrowRight'){flashNext();}
    else if(e.key==='ArrowLeft'){flashPrev();}
  });
}
function render(){
  const list=filtered();
  $('#countPill').textContent=list.length+(list.length===1?' formula':' formulas');
  if(!list.length){$('#view').innerHTML='<div class="empty">No formulas match your search.</div>';return;}
  if(mode==='cheat') renderCheat(list);
  else if(mode==='cards') renderCards(list);
  else renderFlash(list);
}
function detailHTML(f){
  const when=(f.whenToUse||[]).map(w=>`<li>${w}</li>`).join('');
  const used=(f.usedIn||[]).length?`<div class="used-row"><span class="lbl">Used in</span>${f.usedIn.map(u=>`<span class="used-in">${esc(u)}</span>`).join('')}</div>`:'';
  const ex=f.example?`<div class="mini-ex">${f.example}</div>`:'';
  const note=f.note?`<div class="pat-note">${f.note}</div>`:'';
  const whenBlock=when?`<span class="sig-label">When to reach for it</span><ul class="sig-list">${when}</ul>`:'';
  return ex+whenBlock+used+note;
}
function renderCheat(list){
  const body=items=>items.map(f=>`<div class="cheat-row" data-id="${esc(f.id)}">
        <div class="cheat-top"><div class="cheat-name"><span class="twist">&#9654;</span>${esc(f.name)}</div><div class="cheat-day">${esc(f.day||'')}</div></div>
        <div class="cheat-eq">${f.formula}</div>
        <div class="cheat-detail">${detailHTML(f)}</div></div>`).join('');
  $('#view').innerHTML=renderGroups(list, body);
  $('#view').querySelectorAll('.cheat-row').forEach(r=>r.onclick=()=>r.classList.toggle('open'));
}
function cardHTML(f){
  const ex=f.example?`<div class="mini-ex">${f.example}</div>`:'';
  const when=(f.whenToUse||[]).map(w=>`<li>${w}</li>`).join('');
  const used=(f.usedIn||[]).length?`<div class="used-row"><span class="lbl">Used in</span>${f.usedIn.map(u=>`<span class="used-in">${esc(u)}</span>`).join('')}</div>`:'';
  const note=f.note?`<div class="pat-note">${f.note}</div>`:'';
  return `<div class="pat-card"><div class="pat-hdr"><div class="pat-hdr-name">${esc(f.name)}</div><div class="pat-day">${esc(f.day||'')}</div></div>
    <div class="pat-body"><div class="pat-cols">
      <div><div class="formula-eq">${f.formula}</div>${ex}</div>
      <div><span class="sig-label">When to reach for it</span><ul class="sig-list">${when}</ul>${used}</div>
    </div>${note}</div></div>`;
}
function renderCards(list){
  $('#view').innerHTML=renderGroups(list, items=>items.map(cardHTML).join(''));
}
function flashNext(){if(flashIdx<flashPool.length-1){flashIdx++;flashRevealed=false;renderFlashCard();}}
function flashPrev(){if(flashIdx>0){flashIdx--;flashRevealed=false;renderFlashCard();}}
function flashShuffle(){for(let i=flashPool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[flashPool[i],flashPool[j]]=[flashPool[j],flashPool[i]];}flashIdx=0;flashRevealed=false;renderFlashCard();}
function renderFlash(list){
  flashPool=list; if(flashIdx>=flashPool.length) flashIdx=0;
  $('#view').innerHTML=`<div class="flash-wrap">
    <div class="flash-progress" id="flashProg"></div>
    <div id="flashCard"></div>
    <div class="flash-controls">
      <button class="fbtn" id="fPrev">&lsaquo; Prev</button>
      <button class="fbtn primary" id="fReveal">Reveal</button>
      <button class="fbtn" id="fNext">Next &rsaquo;</button>
      <button class="fbtn" id="fShuffle">&#10862; Shuffle</button>
    </div>
    <div class="hint">Space = reveal / next &middot; &larr; &rarr; to move</div></div>`;
  $('#fPrev').onclick=flashPrev;$('#fNext').onclick=flashNext;$('#fShuffle').onclick=flashShuffle;
  $('#fReveal').onclick=()=>{flashRevealed=!flashRevealed;renderFlashCard();};
  renderFlashCard();
}
function renderFlashCard(){
  const f=flashPool[flashIdx]; if(!f) return;
  $('#flashProg').textContent=`${flashIdx+1} / ${flashPool.length}`;
  const when=(f.whenToUse||[]).map(w=>`<li>${w}</li>`).join('');
  const used=(f.usedIn||[]).length?`<div class="used-row"><span class="lbl">Used in</span>${f.usedIn.map(u=>`<span class="used-in">${esc(u)}</span>`).join('')}</div>`:'';
  const ex=f.example?`<div class="mini-ex">${f.example}</div>`:'';
  const note=f.note?`<div class="pat-note">${f.note}</div>`:'';
  const back=flashRevealed?`<div class="flash-back"><div class="flash-q">Formula</div><div class="formula-eq">${f.formula}</div>${ex}${note}</div>`:'';
  $('#flashCard').innerHTML=`<div class="flash-card">
    <div class="flash-cat">${esc(f.topic)} &middot; ${esc(f.day||'')}</div>
    <div class="flash-name">${esc(f.name)}</div>
    <div class="flash-q">When to reach for it</div>
    <ul class="sig-list">${when}</ul>${used}${back}</div>`;
  $('#fReveal').textContent=flashRevealed?'Hide':'Reveal';
}
</script>

</body>
</html>
