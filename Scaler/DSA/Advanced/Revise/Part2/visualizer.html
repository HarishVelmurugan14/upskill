<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizer — Part 2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Layout ── */
    #viz-root { display: flex; gap: 1.5rem; align-items: flex-start; margin-top: 1rem; }
    #problem-panel { width: 240px; flex-shrink: 0; }
    #viz-panel { flex: 1; min-height: 320px; }
    @media (max-width: 720px) { #viz-root { flex-direction: column; } #problem-panel { width: 100%; } }

    /* ── Topic filter ── */
    .topic-bar { display: flex; flex-direction: column; gap: 0; margin-bottom: 1rem; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0; }
    .filter-row.topic-row { border-top: 1px solid var(--border); }
    .topic-pill { padding: 4px 14px; border-radius: 999px; font-size: 12px; cursor: pointer;
                  border: 1px solid var(--border); background: transparent; color: var(--text-muted);
                  font-family: inherit; transition: all 0.15s; }
    .topic-pill:hover { color: var(--text); border-color: #484f58; }
    .topic-pill.active { color: var(--teal); border-color: var(--teal); background: rgba(121,192,255,0.08); }
    .topic-pill.sec-pill { font-weight: 700; font-size: 11px; letter-spacing: 0.3px; }

    /* ── Problem cards ── */
    .prob-card { padding: 10px 13px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
                 border: 1px solid var(--border); background: var(--bg-card); transition: border-color 0.15s; }
    .prob-card:hover { border-color: #484f58; }
    .prob-card.selected { border-color: var(--teal); background: rgba(121,192,255,0.05); }
    .prob-day  { font-size: 10px; font-weight: 700; color: var(--text-muted);
                 font-family: 'JetBrains Mono', monospace; margin-bottom: 3px; }
    .prob-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .prob-meta { font-size: 11px; color: var(--text-muted); }

    /* ── Data-structure cells ── */
    .cell { width: 46px; height: 34px; border-radius: 6px; display: inline-flex; align-items: center;
            justify-content: center; font-size: 13px; font-weight: 600; border: 1px solid;
            transition: all 0.25s; font-family: 'JetBrains Mono', monospace; }
    .c-input  { background: rgba(88,166,255,0.10);  color: var(--blue);        border-color: rgba(88,166,255,0.30); }
    .c-result { background: rgba(63,185,80,0.10);   color: var(--green);       border-color: rgba(63,185,80,0.30); }
    .c-active { background: rgba(210,153,34,0.18);  color: var(--amber);       border-color: rgba(210,153,34,0.45); }
    .c-empty  { background: rgba(139,148,158,0.05); color: var(--text-muted);  border-color: rgba(139,148,158,0.18); border-style: dashed; }

    /* ── DS layout helpers ── */
    .ds-block { margin-bottom: 18px; }
    .ds-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
                color: var(--text-muted); margin-bottom: 8px; }
    .ds-row   { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .stack-top-lbl { font-size: 10px; color: var(--text-muted); margin-left: 6px; }

    /* ── Histogram ── */
    .hist-wrap { display: flex; gap: 4px; align-items: flex-end; }
    .hist-bar-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hist-bar { width: 42px; border-radius: 4px 4px 0 0; display: flex; align-items: flex-end;
                justify-content: center; padding-bottom: 4px; font-size: 12px; font-weight: 700;
                transition: all 0.25s; font-family: 'JetBrains Mono', monospace; border: 1px solid; }
    .hist-idx { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .hb-default { background: rgba(88,166,255,0.12);  color: var(--blue);   border-color: rgba(88,166,255,0.28); }
    .hb-active  { background: rgba(210,153,34,0.22);  color: var(--amber);  border-color: rgba(210,153,34,0.50); }
    .hb-marker  { background: rgba(248,81,73,0.14);   color: var(--red);    border-color: rgba(248,81,73,0.32); }
    .hb-max     { background: rgba(63,185,80,0.18);   color: var(--green);  border-color: rgba(63,185,80,0.40); }

    /* ── Controls ── */
    #explanation { font-size: 13px; color: var(--text-muted); min-height: 42px;
                   text-align: center; margin: 14px 0 6px; line-height: 1.6; }
    #controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    #controls button { font-size: 12px; padding: 6px 16px; cursor: pointer;
                       background: var(--bg-elevated); border: 1px solid var(--border);
                       color: var(--text); border-radius: 6px; font-family: inherit; transition: all 0.15s; }
    #controls button:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
    #controls button:disabled { opacity: 0.35; cursor: default; }
    .complexity-footer { font-size: 11px; color: var(--text-muted); text-align: center;
                         margin-top: 12px; font-family: 'JetBrains Mono', monospace; }
    #viz-empty { color: var(--text-muted); font-size: 13px; padding: 3rem 0; text-align: center; }
    #viz-panel .prob-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .hist-legend { margin-top: 10px; font-size: 11px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .hist-legend span { display: flex; align-items: center; gap: 5px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    /* ── Tree nodes ── */
    .tree-node { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
                 justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid;
                 position: absolute; transform: translate(-50%, -50%);
                 font-family: 'JetBrains Mono', monospace; z-index: 2; transition: all 0.25s; }
    .tn-default { background: rgba(88,166,255,0.10);  color: var(--blue);   border-color: rgba(88,166,255,0.40); }
    .tn-active  { background: rgba(210,153,34,0.22);  color: var(--amber);  border-color: rgba(210,153,34,0.55); }
    .tn-visited { background: rgba(63,185,80,0.15);   color: var(--green);  border-color: rgba(63,185,80,0.45); }
    .tn-path    { background: rgba(163,113,247,0.15); color: var(--purple); border-color: rgba(163,113,247,0.45); }
  </style>
</head>

    <div id="problem-panel">
      <div id="prob-list"></div>

<script>
// ─── Shared render helpers ────────────────────────────────────────────────────
function cell(val, cls) {
  return `<span class="cell ${cls}">${val === -1 ? '–' : val}</span>`;
}
function arrayRow(A, activeIdx) {
  return A.map((v, i) => cell(v, i === activeIdx ? 'c-active' : 'c-input')).join('');
}
function resultRow(res, filledUpTo) {
  return res.map((v, i) =>
    i <= filledUpTo && v !== null
      ? cell(v === -1 ? '–' : v, 'c-result')
      : cell('?', 'c-empty')
  ).join('');
}
function stackRow(st) {
  if (!st.length) return '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';
  return st.map(v => cell(v, 'c-input')).join(' ')
         + '<span class="stack-top-lbl">← top</span>';
}

// ─── Tree render helpers ──────────────────────────────────────────────────────
function mkTree(d) {
  if (!d) return null;
  return { val: d[0], id: d[1], left: mkTree(d[2]), right: mkTree(d[3]) };
}

function renderTree(root, activeId, visitedIds, pathIds, labels) {
  if (!root) return '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';
  let xi = 0, md = 0;
  (function pos(n, d) {
    if (!n) return;
    pos(n.left, d + 1);
    n.px = xi++; n.py = d; if (d > md) md = d;
    pos(n.right, d + 1);
  })(root, 0);
  const all = [];
  (function g(n) { if (!n) return; all.push(n); g(n.left); g(n.right); })(root);
  const CX = 58, CY = 68, W = xi * CX, H = (md + 1) * CY;
  let svg = `<svg width="${W}" height="${H}" style="position:absolute;top:0;left:0">`;
  for (const n of all) {
    for (const ch of [n.left, n.right]) {
      if (!ch) continue;
      const hl = pathIds && pathIds.includes(n.id) && pathIds.includes(ch.id);
      svg += `<line x1="${n.px*CX+CX/2}" y1="${n.py*CY+CY/2}" x2="${ch.px*CX+CX/2}" y2="${ch.py*CY+CY/2}" stroke="${hl ? 'var(--purple)' : 'var(--border)'}" stroke-width="${hl ? 2.5 : 1.5}"/>`;
    }
  }
  svg += '</svg>';
  let divs = '';
  for (const n of all) {
    let cls = 'tn-default';
    if (n.id === activeId) cls = 'tn-active';
    else if (pathIds && pathIds.includes(n.id)) cls = 'tn-path';
    else if (visitedIds && visitedIds.includes(n.id)) cls = 'tn-visited';
    const x = n.px * CX + CX / 2, y = n.py * CY + CY / 2;
    divs += `<div class="tree-node ${cls}" style="left:${x}px;top:${y}px">${n.val}</div>`;
    if (labels && labels[n.id] != null) {
      divs += `<div style="position:absolute;left:${x}px;top:${y+24}px;transform:translateX(-50%);font-size:9px;color:var(--text-muted);white-space:nowrap;font-family:'JetBrains Mono',monospace;z-index:3">${labels[n.id]}</div>`;
    }
  }
  return `<div style="position:relative;width:${W}px;height:${H}px;margin:0 auto">${svg}${divs}</div>`;
}

// ─── PROBLEMS registry ────────────────────────────────────────────────────────
const PROBLEMS = {

  // ── 1 · Previous Smaller Values ─────────────────────────────────────────────
  "d27_prevSmaller": {
    title: "Prev Smaller Values",
    day: "d27",
    section: "Stack",
    topic: "Nearest Smaller / Greater",
    complexity: "O(N) time · O(N) space",
    lc: "~LC 901",
    initial: [4, 5, 2, 10, 8],

    makeSteps(A) {
      const N = A.length;
      const res = new Array(N).fill(null);
      const stk = [];
      const steps = [];

      // i = 0: always -1, push A[0]
      stk.push(A[0]); res[0] = -1;
      steps.push({ i: 0, stk: [...stk], res: [...res], filled: 0,
        msg: `i=0: Stack is empty → res[0] = <b>–1</b>. Push <b>${A[0]}</b> onto stack.` });

      for (let i = 1; i < N; i++) {
        while (stk.length && stk[stk.length - 1] >= A[i]) {
          const popped = stk.pop();
          steps.push({ i, stk: [...stk], res: [...res], filled: i - 1,
            msg: `i=${i}: peek <b>${popped}</b> ≥ <b>${A[i]}</b> → not a smaller neighbour, pop it.` });
        }
        if (stk.length) {
          res[i] = stk[stk.length - 1];
          steps.push({ i, stk: [...stk], res: [...res], filled: i,
            msg: `i=${i}: peek <b>${stk[stk.length-1]}</b> < <b>${A[i]}</b> → res[${i}] = <b>${res[i]}</b>. Push <b>${A[i]}</b>.` });
        } else {
          res[i] = -1;
          steps.push({ i, stk: [...stk], res: [...res], filled: i,
            msg: `i=${i}: Stack empty → no smaller to the left → res[${i}] = <b>–1</b>. Push <b>${A[i]}</b>.` });
        }
        stk.push(A[i]);
      }

      steps.push({ i: -1, stk: [...stk], res: [...res], filled: N - 1, type: 'done',
        msg: `✓ Done. Result: [${res.map(v => v === -1 ? '–1' : v).join(', ')}]` });
      return steps;
    },

    render(canvas, s) {
      const A = [4, 5, 2, 10, 8];
      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">Input Array</div>
          <div class="ds-row">${arrayRow(A, s.i)}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">Stack &nbsp;(values, top is rightmost)</div>
          <div class="ds-row">${stackRow(s.stk)}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">Result &nbsp;(nearest smaller to left)</div>
          <div class="ds-row">${resultRow(s.res, s.filled)}</div>
        </div>`;
    }
  },

  // ── 2 · Next Greater Values ──────────────────────────────────────────────────
  "d27_nextGreater": {
    title: "Next Greater Values",
    day: "d27",
    section: "Stack",
    topic: "Nearest Smaller / Greater",
    complexity: "O(N) time · O(N) space",
    lc: "LC 739 / LC 503",
    initial: [4, 5, 2, 10, 8],

    makeSteps(A) {
      const N = A.length;
      const res = new Array(N).fill(null);
      const stk = [];
      const steps = [];

      // Start from the right: push last element
      stk.push(A[N - 1]); res[N - 1] = -1;
      steps.push({ i: N - 1, stk: [...stk], res: [...res],
        msg: `Start from right. i=${N-1}: nothing to the right → res[${N-1}] = <b>–1</b>. Push <b>${A[N-1]}</b>.` });

      for (let i = N - 2; i >= 0; i--) {
        while (stk.length && stk[stk.length - 1] <= A[i]) {
          const popped = stk.pop();
          steps.push({ i, stk: [...stk], res: [...res],
            msg: `i=${i}: peek <b>${popped}</b> ≤ <b>${A[i]}</b> → not greater, pop it.` });
        }
        if (stk.length) {
          res[i] = stk[stk.length - 1];
          steps.push({ i, stk: [...stk], res: [...res],
            msg: `i=${i}: peek <b>${stk[stk.length-1]}</b> > <b>${A[i]}</b> → res[${i}] = <b>${res[i]}</b>. Push <b>${A[i]}</b>.` });
        } else {
          res[i] = -1;
          steps.push({ i, stk: [...stk], res: [...res],
            msg: `i=${i}: Stack empty → no greater to the right → res[${i}] = <b>–1</b>. Push <b>${A[i]}</b>.` });
        }
        stk.push(A[i]);
      }

      steps.push({ i: -1, stk: [...stk], res: [...res], type: 'done',
        msg: `✓ Done. Result: [${res.map(v => v === -1 ? '–1' : v).join(', ')}]` });
      return steps;
    },

    render(canvas, s) {
      const A = [4, 5, 2, 10, 8];
      // result: filled = any index where res[i] !== null
      const resHtml = s.res.map((v, i) =>
        v !== null ? cell(v === -1 ? '–' : v, 'c-result') : cell('?', 'c-empty')
      ).join('');
      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">Input Array &nbsp;(processing right → left)</div>
          <div class="ds-row">${arrayRow(A, s.i)}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">Stack &nbsp;(values, top is rightmost)</div>
          <div class="ds-row">${stackRow(s.stk)}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">Result &nbsp;(next greater to the right)</div>
          <div class="ds-row">${resHtml}</div>
        </div>`;
    }
  },

  // ── 3 · Next Greater Element for Subset Queries (//#-lc-1 · LC496) ────────────
  "d27_nextGreaterSubset": {
    title: "Next Greater — Subset Queries",
    day: "d27",
    section: "Stack",
    topic: "Nearest Smaller / Greater",
    complexity: "O(N+M) time · O(N) space",
    lc: "LC 496",
    initial: { nums2: [1, 3, 4, 2], nums1: [4, 1, 2] },

    makeSteps({ nums2, nums1 }) {
      const N = nums2.length, M = nums1.length;
      const steps = [];
      const stk = [], map = {};

      steps.push({ phase: 'build', i: -1, stk: [], map: {}, qi: -1, res: new Array(M).fill(null),
        msg: `Phase 1: build NGE map for nums2 = [${nums2.join(', ')}] traversing right → left.` });

      stk.push(nums2[N - 1]); map[nums2[N - 1]] = -1;
      steps.push({ phase: 'build', i: N - 1, stk: [...stk], map: { ...map }, qi: -1, res: new Array(M).fill(null),
        msg: `i=${N-1}: rightmost element <b>${nums2[N-1]}</b> — nothing to its right → map[${nums2[N-1]}] = <b>–1</b>. Push.` });

      for (let i = N - 2; i >= 0; i--) {
        const v = nums2[i];
        while (stk.length && stk[stk.length - 1] <= v) {
          const p = stk.pop();
          steps.push({ phase: 'build', i, stk: [...stk], map: { ...map }, qi: -1, res: new Array(M).fill(null),
            msg: `i=${i}: peek <b>${p}</b> ≤ <b>${v}</b> → not a next greater, pop.` });
        }
        map[v] = stk.length ? stk[stk.length - 1] : -1;
        steps.push({ phase: 'build', i, stk: [...stk], map: { ...map }, qi: -1, res: new Array(M).fill(null),
          msg: `i=${i}: map[<b>${v}</b>] = <b>${map[v] === -1 ? '–1' : map[v]}</b>. Push <b>${v}</b>.` });
        stk.push(v);
      }

      const res = new Array(M).fill(null);
      steps.push({ phase: 'query', i: -1, stk: [], map: { ...map }, qi: -1, res: [...res],
        msg: `Phase 2: answer queries for nums1 = [${nums1.join(', ')}] using the map.` });

      for (let qi = 0; qi < M; qi++) {
        res[qi] = map[nums1[qi]];
        steps.push({ phase: 'query', i: -1, stk: [], map: { ...map }, qi, res: [...res],
          msg: `nums1[${qi}] = <b>${nums1[qi]}</b> → map[${nums1[qi]}] = <b>${res[qi] === -1 ? '–1' : res[qi]}</b>` });
      }

      steps.push({ phase: 'done', i: -1, stk: [], map: { ...map }, qi: -1, res: [...res], type: 'done',
        msg: `✓ Done. Result: [${res.map(v => v === -1 ? '–1' : v).join(', ')}]` });
      return steps;
    },

    render(canvas, s) {
      const nums2 = [1, 3, 4, 2], nums1 = [4, 1, 2];
      const N = nums2.length, M = nums1.length;

      // nums2 array (dictionary)
      const n2Html = nums2.map((v, i) =>
        cell(v, i === s.i ? 'c-active' : 'c-input')
      ).join('');

      // map entries
      const mapHtml = Object.entries(s.map).map(([k, v]) =>
        `<span style="font-family:'JetBrains Mono',monospace;font-size:12px;
          color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);
          border-radius:5px;padding:3px 9px;margin:2px">${k}→<b style="color:var(--teal)">${v === -1 ? '–1' : v}</b></span>`
      ).join('');

      // result row
      const resHtml = s.res.map((v, i) =>
        v !== null ? cell(v === -1 ? '–' : v, 'c-result') : cell('?', 'c-empty')
      ).join('');

      // nums1 row (highlight current query)
      const n1Html = nums1.map((v, i) =>
        cell(v, i === s.qi ? 'c-active' : 'c-input')
      ).join('');

      const stkHtml = stackRow(s.stk);
      const showQuery = s.phase === 'query' || s.phase === 'done';

      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">nums2 &nbsp;(build NGE map, right → left)</div>
          <div class="ds-row">${n2Html}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">Stack</div>
          <div class="ds-row">${stkHtml}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">NGE Map</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">${mapHtml || '<span style="color:var(--text-muted);font-size:12px">(empty)</span>'}</div>
        </div>
        ${showQuery ? `
        <div class="ds-block">
          <div class="ds-label">nums1 &nbsp;(queries)</div>
          <div class="ds-row">${n1Html}</div>
        </div>
        <div class="ds-block">
          <div class="ds-label">Result</div>
          <div class="ds-row">${resHtml}</div>
        </div>` : ''}`;
    }
  },

  // ── 4 · Sort Stack Using Another Stack (//#-scl-aq3) ────────────────────────
  "d27_sortStack": {
    title: "Sort Stack Using Another Stack",
    day: "d27",
    section: "Stack",
    topic: "Stack Basics",
    complexity: "O(N²) time · O(N) space",
    lc: "",
    initial: [5, 17, 100, 11],

    makeSteps(A) {
      const steps = [];
      const inp = [...A].reverse(); // push order: 5,17,100,11 → top=11
      const srt = [];

      steps.push({ inp: [...inp], srt: [], temp: null,
        msg: `Push all elements onto input stack. Top = <b>${inp[inp.length-1]}</b>.` });

      while (inp.length) {
        const x = inp.pop();
        steps.push({ inp: [...inp], srt: [...srt], temp: x,
          msg: `Pop <b>${x}</b> from input stack.` });

        if (!srt.length) {
          srt.push(x);
          steps.push({ inp: [...inp], srt: [...srt], temp: null,
            msg: `Sorted stack empty → push <b>${x}</b> directly.` });
        } else if (srt[srt.length - 1] <= x) {
          srt.push(x);
          steps.push({ inp: [...inp], srt: [...srt], temp: null,
            msg: `Sorted top <b>${srt[srt.length-2]}</b> ≤ <b>${x}</b> → push <b>${x}</b> directly (maintains order).` });
        } else {
          let count = 0;
          while (srt.length && srt[srt.length - 1] >= x) {
            const mv = srt.pop();
            inp.push(mv);
            count++;
            steps.push({ inp: [...inp], srt: [...srt], temp: x,
              msg: `Sorted top <b>${mv}</b> ≥ <b>${x}</b> → move <b>${mv}</b> back to input to make room.` });
          }
          srt.push(x);
          steps.push({ inp: [...inp], srt: [...srt], temp: null,
            msg: `Push <b>${x}</b> onto sorted stack (correct position found).` });
          let pushed = 0;
          while (pushed < count) {
            const mv = inp.pop();
            srt.push(mv);
            pushed++;
            steps.push({ inp: [...inp], srt: [...srt], temp: null,
              msg: `Restore <b>${mv}</b> back to sorted stack (${pushed}/${count}).` });
          }
        }
      }

      steps.push({ inp: [], srt: [...srt], temp: null, type: 'done',
        msg: `✓ Done. Sorted (top → bottom): [${[...srt].reverse().join(', ')}] &nbsp;·&nbsp; smallest on top.` });
      return steps;
    },

    render(canvas, s) {
      function vstack(arr, label) {
        const cells = [...arr].map(v => `<div class="cell c-input" style="width:52px">${v}</div>`);
        // stack: bottom is index 0, top is last. Display top at top visually.
        const inner = cells.length
          ? cells.reverse().join('')
          : `<span style="color:var(--text-muted);font-size:12px">(empty)</span>`;
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px">
          <div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
            color:var(--text-muted);margin-bottom:6px">${label}</div>
          <div style="display:flex;flex-direction:column;gap:4px;min-height:120px;justify-content:flex-end">
            ${inner}
          </div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:4px">↑ top</div>
        </div>`;
      }

      const tempHtml = s.temp !== null
        ? `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px">
            <div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
              color:var(--text-muted);margin-bottom:6px">placing</div>
            <div class="cell c-active" style="width:52px">${s.temp}</div>
          </div>`
        : `<div style="min-width:80px"></div>`;

      canvas.innerHTML = `
        <div class="ds-block">
          <div style="display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap">
            ${vstack(s.inp, 'Input')}
            ${tempHtml}
            ${vstack(s.srt, 'Sorted')}
          </div>
        </div>`;
    }
  },

  // ── 5 · Sum of (Max − Min) for All Subarrays (//#-scl-q3) ──────────────────
  "d27_maxMinSubarrays": {
    title: "Sum of (Max − Min) All Subarrays",
    day: "d27",
    section: "Stack",
    topic: "Nearest Smaller / Greater",
    complexity: "O(N) time · O(N) space",
    lc: "",
    initial: [1, 3, 3],

    makeSteps(A) {
      const N = A.length, steps = [];

      // Precompute all 4 arrays
      const ps = new Array(N), pg = new Array(N), ns = new Array(N), ng = new Array(N);
      { const st = []; ps[0] = -1; st.push(0);
        for (let i = 1; i < N; i++) { while (st.length && A[st[st.length-1]] >= A[i]) st.pop(); ps[i] = st.length ? st[st.length-1] : -1; st.push(i); } }
      { const st = []; pg[0] = -1; st.push(0);
        for (let i = 1; i < N; i++) { while (st.length && A[st[st.length-1]] <= A[i]) st.pop(); pg[i] = st.length ? st[st.length-1] : -1; st.push(i); } }
      { const st = [];
        for (let i = N-1; i >= 0; i--) { while (st.length && A[st[st.length-1]] > A[i]) st.pop(); ns[i] = st.length ? st[st.length-1] : N; st.push(i); } }
      { const st = [];
        for (let i = N-1; i >= 0; i--) { while (st.length && A[st[st.length-1]] < A[i]) st.pop(); ng[i] = st.length ? st[st.length-1] : N; st.push(i); } }

      steps.push({ phase: 'intro', ci: -1, ps, pg, ns, ng, sum: 0, contrib: null,
        msg: `A = [${A.join(', ')}]. Key idea: A[i]'s contribution as MAX minus as MIN across all subarrays it dominates — computed in O(1) per element using 4 monotonic stack passes.` });

      steps.push({ phase: 'arrays', ci: -1, ps, pg, ns, ng, sum: 0, contrib: null,
        msg: `4 boundary arrays precomputed.<br>
          <b>prevSmaller</b> [${ps.map(v=>v===-1?'–1':v)}] &nbsp; <b>nextSmaller</b> [${ns.map(v=>v===N?'N':v)}]<br>
          <b>prevGreater</b> [${pg.map(v=>v===-1?'–1':v)}] &nbsp; <b>nextGreater</b> [${ng.map(v=>v===N?'N':v)}]` });

      let sum = 0;
      for (let i = 0; i < N; i++) {
        const cMax = (i - pg[i]) * (ng[i] - i);
        const cMin = (i - ps[i]) * (ns[i] - i);
        const contrib = A[i] * cMax - A[i] * cMin;
        sum += contrib;
        steps.push({ phase: 'element', ci: i, ps, pg, ns, ng, sum, cMax, cMin, contrib,
          msg: `A[${i}]=${A[i]}: countAsMax=(${i}−${pg[i]})×(${ng[i]}−${i})=<b>${cMax}</b>, countAsMin=(${i}−${ps[i]})×(${ns[i]}−${i})=<b>${cMin}</b> → contrib = ${A[i]}×${cMax} − ${A[i]}×${cMin} = <b>${contrib}</b> &nbsp;·&nbsp; sum = <b>${sum}</b>` });
      }

      steps.push({ phase: 'done', ci: -1, ps, pg, ns, ng, sum, contrib: null, type: 'done',
        msg: `✓ Done. sum of (max−min) across all subarrays = <b>${sum}</b>` });
      return steps;
    },

    render(canvas, s) {
      const A = [1, 3, 3], N = A.length;
      const arrHtml = A.map((v, i) => cell(v, i === s.ci ? 'c-active' : 'c-input')).join('');

      let detailHtml = '';
      if (s.phase === 'element') {
        const i = s.ci;
        detailHtml = `
          <div style="margin-top:14px;background:var(--bg-card);border:1px solid var(--border);
            border-radius:8px;padding:14px 16px;font-size:12px;line-height:2">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px">
              <div><span style="color:var(--text-muted)">prevGreater[${i}]</span> = <b>${s.pg[i]===-1?'–1':s.pg[i]}</b></div>
              <div><span style="color:var(--text-muted)">nextGreater[${i}]</span> = <b>${s.ng[i]===N?'N':s.ng[i]}</b></div>
              <div><span style="color:var(--text-muted)">prevSmaller[${i}]</span> = <b>${s.ps[i]===-1?'–1':s.ps[i]}</b></div>
              <div><span style="color:var(--text-muted)">nextSmaller[${i}]</span> = <b>${s.ns[i]===N?'N':s.ns[i]}</b></div>
            </div>
            <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
              <span style="color:var(--green)">countAsMax</span> = (${i}−${s.pg[i]}) × (${s.ng[i]}−${i}) = <b>${s.cMax}</b><br>
              <span style="color:var(--red)">countAsMin</span> = (${i}−${s.ps[i]}) × (${s.ns[i]}−${i}) = <b>${s.cMin}</b><br>
              contribution = ${A[i]}×${s.cMax} − ${A[i]}×${s.cMin} = <b style="color:var(--amber)">${s.contrib}</b>
            </div>
          </div>`;
      }

      const sumColor = s.phase === 'done' ? 'var(--green)' : 'var(--text)';
      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">Array A</div>
          <div class="ds-row">${arrHtml}</div>
          ${detailHtml}
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:8px;font-family:'JetBrains Mono',monospace">
          Running sum = <b style="color:${sumColor};font-size:14px">${s.sum}</b>
        </div>`;
    }
  },

  // ── 6 · Largest Rectangle in Histogram ──────────────────────────────────────
  "d27_histogram": {
    title: "Largest Rectangle in Histogram",
    day: "d27",
    section: "Stack",
    topic: "Nearest Smaller / Greater",
    complexity: "O(N) time · O(N) space",
    lc: "LC 84",
    initial: [2, 1, 5, 6, 2, 3],

    makeSteps(A) {
      const N = A.length;
      const steps = [];

      // Pre-compute prevSmaller (indices, left to right)
      const ps = new Array(N).fill(-1);
      { const stk = []; ps[0] = -1; stk.push(0);
        for (let i = 1; i < N; i++) {
          while (stk.length && A[stk[stk.length-1]] >= A[i]) stk.pop();
          ps[i] = stk.length ? stk[stk.length-1] : -1;
          stk.push(i);
        }
      }

      // Pre-compute nextSmaller (indices, right to left)
      const ns = new Array(N).fill(N);
      { const stk = [];
        for (let i = N-1; i >= 0; i--) {
          while (stk.length && A[stk[stk.length-1]] >= A[i]) stk.pop();
          ns[i] = stk.length ? stk[stk.length-1] : N;
          stk.push(i);
        }
      }

      steps.push({ phase: 'intro', active: -1, ps: [...ps], ns: [...ns],
        maxArea: 0, curArea: 0, maxIdx: -1,
        msg: `A = [${A.join(', ')}]. Precomputed prevSmaller and nextSmaller with two monotonic-stack passes. Now compute area per bar.` });

      let maxArea = 0, maxIdx = -1;
      for (let i = 0; i < N; i++) {
        const w = ns[i] - ps[i] - 1;
        const area = A[i] * w;
        if (area > maxArea) { maxArea = area; maxIdx = i; }
        steps.push({ phase: 'bar', active: i, ps: [...ps], ns: [...ns],
          maxArea, curArea: area, maxIdx,
          msg: `Bar ${i} (h=<b>${A[i]}</b>): prevSmaller=${ps[i]===-1?'–1':ps[i]}, nextSmaller=${ns[i]===N?'N':ns[i]} → width = ${ns[i]}${ns[i]===N?'(N)':''} – ${ps[i]===-1?'(–1)':ps[i]} – 1 = <b>${w}</b> → area = ${A[i]} × ${w} = <b>${area}</b>${area===maxArea?' 🏆 new max':''}` });
      }

      steps.push({ phase: 'done', active: -1, ps, ns,
        maxArea, curArea: maxArea, maxIdx, type: 'done',
        msg: `✓ Max area = <b>${maxArea}</b> &nbsp;(bar ${maxIdx}, height=${A[maxIdx]}, width=${ns[maxIdx]-ps[maxIdx]-1})` });
      return steps;
    },

    render(canvas, s) {
      const A = [2, 1, 5, 6, 2, 3];
      const N = A.length;
      const UNIT = 26; // px per unit of height

      let barsHtml = '';
      for (let i = 0; i < N; i++) {
        let cls = 'hb-default';
        if (s.type === 'done' && i === s.maxIdx) {
          cls = 'hb-max';
        } else if (s.phase === 'bar') {
          if (i === s.active) cls = 'hb-active';
          else if (i === s.ps[s.active] || i === s.ns[s.active]) cls = 'hb-marker';
        }
        const h = A[i] * UNIT;
        barsHtml += `<div class="hist-bar-box">
          <div class="hist-bar ${cls}" style="height:${h}px">${A[i]}</div>
          <div class="hist-idx">[${i}]</div>
        </div>`;
      }

      let infoHtml = '';
      if (s.phase === 'bar' && s.active >= 0) {
        const i = s.active, w = s.ns[i] - s.ps[i] - 1;
        infoHtml = `<div style="margin-top:10px;font-size:12px;color:var(--text-muted)">
          width = nextSmaller(${s.ns[i]===N?'N':s.ns[i]}) − prevSmaller(${s.ps[i]===-1?'–1':s.ps[i]}) − 1 = <b style="color:var(--text)">${w}</b>
          &nbsp;·&nbsp; area = ${A[i]} × ${w} = <b style="color:var(--amber)">${s.curArea}</b>
        </div>`;
      } else if (s.type === 'done') {
        infoHtml = `<div style="margin-top:10px;font-size:13px;color:var(--green);font-weight:600">
          Max Area = ${s.maxArea}
        </div>`;
      }

      const maxH = Math.max(...A) * UNIT;
      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">Histogram</div>
          <div class="hist-wrap" style="height:${maxH + 4}px">${barsHtml}</div>
          <div class="hist-legend">
            <span><span class="leg-dot" style="background:rgba(210,153,34,0.35)"></span>active bar</span>
            <span><span class="leg-dot" style="background:rgba(248,81,73,0.25)"></span>prevSmaller / nextSmaller boundary</span>
            <span><span class="leg-dot" style="background:rgba(63,185,80,0.30)"></span>max area bar</span>
          </div>
          ${infoHtml}
        </div>
        <div style="font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:6px">
          prevSmaller: [${s.ps.map(v=>v===-1?'–1':v).join(', ')}]
          &nbsp;·&nbsp;
          nextSmaller: [${s.ns.map(v=>v===N?'N':v).join(', ')}]
        </div>`;
    }
  },

  // ── d28 Q1 · Implement Queue Using Two Stacks (/##) ─────────────────────────
  "d28_implementQueuesUsingStack": {
    title: "Implement Queue Using Stacks",
    day: "d28",
    section: "Queue",
    topic: "Queue",
    complexity: "O(1) amortized · O(N) space",
    lc: "LC 232",
    initial: null,

    makeSteps(_) {
      const steps = [];
      let inp = [], out = [];

      steps.push({ inp: [], out: [], hl: null,
        msg: `Two stacks simulate a queue. <b>inputStack</b> receives all pushes. <b>outputStack</b> serves pop/peek — lazy transfer only when outputStack is empty.` });

      for (const v of [3, 4, 5, 6]) {
        inp = [...inp, v];
        steps.push({ inp: [...inp], out: [...out], hl: { s: 'in', v },
          msg: `enqueue(<b>${v}</b>) → push onto inputStack. outputStack untouched.` });
      }

      steps.push({ inp: [...inp], out: [...out], hl: null,
        msg: `peek() called — outputStack is empty → transfer all from inputStack (lazy reversal).` });

      while (inp.length) {
        const v = inp[inp.length - 1];
        inp = inp.slice(0, -1);
        out = [...out, v];
        steps.push({ inp: [...inp], out: [...out], hl: { s: 'out', v },
          msg: `Transfer: pop <b>${v}</b> from inputStack → push onto outputStack. Reversal restores FIFO order.` });
      }

      steps.push({ inp: [...inp], out: [...out], hl: { s: 'out', v: out[out.length - 1] },
        msg: `peek() = outputStack.top = <b>${out[out.length - 1]}</b> (first element ever enqueued). ✓` });

      const popped = out[out.length - 1];
      out = out.slice(0, -1);
      steps.push({ inp: [...inp], out: [...out], hl: null,
        msg: `dequeue() → pop outputStack.top = <b>${popped}</b>. inputStack untouched.` });

      inp = [...inp, 7];
      steps.push({ inp: [...inp], out: [...out], hl: { s: 'in', v: 7 },
        msg: `enqueue(<b>7</b>) → inputStack. outputStack still has leftover elements — no transfer needed.` });

      steps.push({ inp: [...inp], out: [...out], hl: { s: 'out', v: out[out.length - 1] },
        msg: `peek() → outputStack not empty, top = <b>${out[out.length - 1]}</b>. No transfer needed.` });

      steps.push({ inp: [...inp], out: [...out], hl: null, type: 'done',
        msg: `✓ Each element crosses stacks <b>exactly once</b> total → amortized O(1) per operation.` });
      return steps;
    },

    render(canvas, s) {
      function vstk(arr, label, hlVal) {
        const cells = arr.length
          ? [...arr].reverse().map((v, i) =>
              `<div class="cell ${i === 0 && hlVal === v ? 'c-active' : 'c-input'}" style="width:50px">${v}</div>`
            ).join('')
          : `<span style="color:var(--text-muted);font-size:11px;padding:8px 0">(empty)</span>`;
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:0;min-width:90px">
          <div class="ds-label">${label}</div>
          <div style="display:flex;flex-direction:column;gap:4px;min-height:160px;justify-content:flex-end">${cells}</div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:6px">↑ top</div>
        </div>`;
      }
      const inHl = s.hl && s.hl.s === 'in'  ? s.hl.v : null;
      const outHl = s.hl && s.hl.s === 'out' ? s.hl.v : null;
      canvas.innerHTML = `<div class="ds-block">
        <div style="display:flex;gap:48px;align-items:flex-end;flex-wrap:wrap">
          ${vstk(s.inp, 'inputStack', inHl)}
          ${vstk(s.out, 'outputStack', outHl)}
        </div>
      </div>`;
    }
  },

  // ── d28 Q2 · Parking Ice Cream Truck — Sliding Window Max (/##) ─────────────
  "d28_parkingIceCreamTruck": {
    title: "Parking Ice Cream Truck",
    day: "d28",
    section: "Queue",
    topic: "Queue",
    complexity: "O(N) time · O(K) space",
    lc: "",
    initial: { A: [3, 1, 2, 5, 4], k: 2 },

    makeSteps({ A, k }) {
      const N = A.length, steps = [], dq = [], res = [];
      steps.push({ dq: [], res: [], ci: -1, win: [-1, -1],
        msg: `A=[${A}], K=${k}. Monotonic deque stores indices of potential window-max candidates (values decrease front→back).` });
      for (let i = 0; i < N; i++) {
        while (dq.length && A[i] >= A[dq[dq.length - 1]]) {
          const p = dq.pop();
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [Math.max(0, i - k + 1), i],
            msg: `i=${i}: A[${p}]=${A[p]} ≤ A[${i}]=${A[i]} — will never be max while ${A[i]} is in window → pop index ${p}.` });
        }
        dq.push(i);
        if (dq[0] < i - k + 1) {
          const ev = dq.shift();
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [Math.max(0, i - k + 1), i],
            msg: `Index ${ev} is outside window [${i - k + 1}, ${i}] → evict from front.` });
        }
        if (i >= k - 1) {
          res.push(A[dq[0]]);
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [i - k + 1, i],
            msg: `Window [${i-k+1}..${i}] = [${A.slice(i-k+1, i+1)}]. Front of deque → max = <b>${A[dq[0]]}</b>` });
        } else {
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [-1, -1],
            msg: `i=${i}: deque=[${dq.map(x => A[x])}]. Window not yet full.` });
        }
      }
      steps.push({ dq: [...dq], res: [...res], ci: -1, win: [-1, -1], type: 'done',
        msg: `✓ Result: [${res}]` });
      return steps;
    },

    render(canvas, s) {
      const A = [3, 1, 2, 5, 4];
      const arrH = A.map((v, i) => {
        if (i === s.ci) return cell(v, 'c-active');
        if (s.win[0] >= 0 && i >= s.win[0] && i <= s.win[1]) return cell(v, 'c-result');
        return cell(v, 'c-input');
      }).join('');
      const dqH = s.dq.length
        ? s.dq.map(idx => `<span class="cell c-input" style="width:46px" title="idx ${idx}">${A[idx]}</span>`).join('')
        : `<span style="color:var(--text-muted);font-size:12px">(empty)</span>`;
      const resH = s.res.map(v => cell(v, 'c-result')).join('') || `<span style="color:var(--text-muted);font-size:12px">—</span>`;
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Array &nbsp;(amber=current · green=window)</div><div class="ds-row">${arrH}</div></div>
        <div class="ds-block"><div class="ds-label">Deque &nbsp;(front→back, values decreasing)</div><div class="ds-row">${dqH}</div></div>
        <div class="ds-block"><div class="ds-label">Result</div><div class="ds-row">${resH}</div></div>`;
    }
  },

  // ── d28 AQ1 · N Integers Containing Only 1 2 3 (/##) ────────────────────────
  "d28_nIntegersContaining123": {
    title: "N Integers Containing 1, 2, 3",
    day: "d28",
    section: "Queue",
    topic: "Queue",
    complexity: "O(N) time · O(N) space",
    lc: "",
    initial: 6,

    makeSteps(A) {
      const steps = [], queue = [1, 2, 3], res = [];
      steps.push({ queue: [...queue], res: [], cur: null,
        msg: `Seed queue with [1, 2, 3]. BFS: each dequeued number n spawns children n×10+1, n×10+2, n×10+3.` });
      for (let i = 0; i < A; i++) {
        const num = queue.shift();
        res.push(num);
        queue.push(num * 10 + 1, num * 10 + 2, num * 10 + 3);
        steps.push({ queue: [...queue], res: [...res], cur: num,
          msg: `Poll <b>${num}</b> → result[${i}]=${num}. Enqueue <b>${num*10+1}</b>, <b>${num*10+2}</b>, <b>${num*10+3}</b>.` });
      }
      steps.push({ queue: [...queue], res: [...res], cur: null, type: 'done',
        msg: `✓ First ${A} numbers using digits {1,2,3}: [${res.join(', ')}]` });
      return steps;
    },

    render(canvas, s) {

    day: "d28",
    section: "Queue",
    topic: "Queue",
    complexity: "O(N) time · O(1) space",
    lc: "~LC 1429",
    initial: "ababc",

    makeSteps(A) {
      const steps = [], map = {}, deq = [];
      let board = '';
      steps.push({ ci: -1, deq: [], map: {}, board: '', char: null,
        msg: `Input: "<b>${A}</b>". Deque holds characters seen exactly once, in order. Evict from front when count > 1.` });
      for (let i = 0; i < A.length; i++) {
        const x = A[i];
        if (!map[x]) { deq.push(x); map[x] = 0; }
        map[x]++;
        while (deq.length && map[deq[0]] > 1) deq.shift();
        const ch = deq.length ? deq[0] : '#';
        board += ch;
        steps.push({ ci: i, deq: [...deq], map: { ...map }, board, char: x,

      }
      steps.push({ ci: -1, deq: [...deq], map: { ...map }, board, char: null, type: 'done',
        msg: `✓ Board: "<b>${board}</b>"` });
      return steps;
    },

  // ── d28 AQ3 · Sum of Min and Max in All Windows (/## · LC1438) ───────────────
  "d28_sumOfMinAndMax": {
    title: "Sum of Min + Max (All Windows)",
    day: "d28",
    section: "Queue",
    topic: "Queue",
    complexity: "O(N) time · O(K) space",
    lc: "LC 1438",
    initial: { A: [2, 1, 5, 3], B: 2 },

    makeSteps({ A, B }) {
      const N = A.length, steps = [], maxD = [], minD = [];
      let sum = 0;
      steps.push({ maxD: [], minD: [], ci: -1, win: [-1, -1], sum: 0, wMax: null, wMin: null,
        msg: `A=[${A}], B=${B}. Two deques: <b>maxD</b> (decreasing → front=window max), <b>minD</b> (increasing → front=window min). Sum += max+min each window.` });
      for (let i = 0; i < N; i++) {
        while (maxD.length && A[maxD[maxD.length - 1]] <= A[i]) maxD.pop();
        maxD.push(i);
        while (minD.length && A[minD[minD.length - 1]] >= A[i]) minD.pop();
        minD.push(i);
        if (maxD[0] < i - B + 1) maxD.shift();
        if (minD[0] < i - B + 1) minD.shift();
        if (i >= B - 1) {
          const wMax = A[maxD[0]], wMin = A[minD[0]];
          sum += wMax + wMin;
          steps.push({ maxD: [...maxD], minD: [...minD], ci: i, win: [i - B + 1, i], sum, wMax, wMin,
            msg: `Window [${i-B+1}..${i}]: max=<b>${wMax}</b>, min=<b>${wMin}</b>. sum += ${wMax}+${wMin} → sum = <b>${sum}</b>` });
        } else {
          steps.push({ maxD: [...maxD], minD: [...minD], ci: i, win: [-1, -1], sum, wMax: null, wMin: null,
            msg: `i=${i}: maxD=[${maxD.map(x => A[x])}], minD=[${minD.map(x => A[x])}]. Window not full yet.` });
        }
      }
      steps.push({ maxD: [...maxD], minD: [...minD], ci: -1, win: [-1, -1], sum, wMax: null, wMin: null, type: 'done',
        msg: `✓ Total = <b>${sum}</b>` });
      return steps;
    },

    render(canvas, s) {
      const A = [2, 1, 5, 3];
      const arrH = A.map((v, i) => {
        if (s.win[0] >= 0 && i >= s.win[0] && i <= s.win[1]) return cell(v, i === s.ci ? 'c-active' : 'c-result');
        return cell(v, 'c-input');
      }).join('');
      function deqRow(dq, lbl, cls) {
        const h = dq.length
          ? dq.map(idx => `<span class="cell ${cls}" style="width:46px">${A[idx]}</span>`).join('')
          : `<span style="color:var(--text-muted);font-size:12px">(empty)</span>`;
        return `<div class="ds-block"><div class="ds-label">${lbl}</div><div class="ds-row">${h}</div></div>`;
      }
      const winInfo = s.wMax !== null
        ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px">max=<b style="color:var(--green)">${s.wMax}</b> · min=<b style="color:var(--red)">${s.wMin}</b></div>` : '';
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Array &nbsp;(green=window · amber=current)</div><div class="ds-row">${arrH}</div></div>
        ${deqRow(s.maxD, 'maxDeque (front = window max, values decreasing)', 'c-result')}
        ${deqRow(s.minD, 'minDeque (front = window min, values increasing)', 'c-active')}
        ${winInfo}
        <div style="font-size:12px;color:var(--text-muted);margin-top:8px;font-family:'JetBrains Mono',monospace">
          Running sum = <b style="color:${s.type === 'done' ? 'var(--green)' : 'var(--text)'}">${s.sum}</b>
        </div>`;
    }
  },

  // ── d28 LC239 · Maximum in Fixed Sliding Window (/##) ───────────────────────
  "d28_maximumInAFixedSlidingWindow": {
    title: "Maximum in Fixed Sliding Window",
    day: "d28",
    section: "Queue",
    topic: "Queue",
    complexity: "O(N) time · O(K) space",
    lc: "LC 239",
    initial: { A: [1, 3, -1, -3, 5, 3, 6, 7], k: 3 },

    makeSteps({ A, k }) {
      const N = A.length, steps = [], dq = [], res = [];
      steps.push({ dq: [], res: [], ci: -1, win: [-1, -1],
        msg: `A=[${A}], K=${k}. Classic LC239. Deque stores indices; front always holds index of window maximum.` });
      for (let i = 0; i < N; i++) {
        while (dq.length && A[i] >= A[dq[dq.length - 1]]) {
          const p = dq.pop();
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [Math.max(0, i - k + 1), i],
            msg: `i=${i}: A[${p}]=${A[p]} ≤ ${A[i]} → can never be max while ${A[i]} present → pop ${p}.` });
        }
        dq.push(i);
        if (dq[0] < i - k + 1) {
          const ev = dq.shift();
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [Math.max(0, i - k + 1), i],
            msg: `Index ${ev} fell outside window [${i-k+1}, ${i}] → evict from front.` });
        }
        if (i >= k - 1) {
          res.push(A[dq[0]]);
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [i - k + 1, i],
            msg: `Window [${i-k+1}..${i}] = [${A.slice(i-k+1, i+1)}]. Max = <b>${A[dq[0]]}</b>` });
        } else {
          steps.push({ dq: [...dq], res: [...res], ci: i, win: [-1, -1],
            msg: `i=${i}: deque=[${dq.map(x => A[x])}]. Filling first window.` });
        }
      }
      steps.push({ dq: [...dq], res: [...res], ci: -1, win: [-1, -1], type: 'done',
        msg: `✓ Result: [${res}]` });
      return steps;
    },

    render(canvas, s) {
      const A = [1, 3, -1, -3, 5, 3, 6, 7];
      const arrH = A.map((v, i) => {
        if (i === s.ci) return cell(v, 'c-active');
        if (s.win[0] >= 0 && i >= s.win[0] && i <= s.win[1]) return cell(v, 'c-result');
        return cell(v, 'c-input');
      }).join('');
      const dqH = s.dq.length
        ? s.dq.map(idx => `<span class="cell c-input" style="width:46px" title="idx ${idx}">${A[idx]}</span>`).join('')
        : `<span style="color:var(--text-muted);font-size:12px">(empty)</span>`;
      const resH = s.res.map(v => cell(v, 'c-result')).join('') || `<span style="color:var(--text-muted);font-size:12px">—</span>`;
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Array &nbsp;(amber=current · green=window)</div><div class="ds-row">${arrH}</div></div>
        <div class="ds-block"><div class="ds-label">Deque &nbsp;(indices, values shown; front=max)</div><div class="ds-row">${dqH}</div></div>
        <div class="ds-block"><div class="ds-label">Result</div><div class="ds-row">${resH}</div></div>`;
    }
  },

  // ── d30 Q1 · Level Order Traversal (/##) ────────────────────────────────────
  "d30_levelOrderTraversal": {
    title: "Level Order Traversal",
    day: "d30",
    section: "Tree",
    topic: "Views & Types",
    complexity: "O(N) time · O(N) space",
    lc: "LC 102",
    initial: null,

    makeSteps(_) {
      const nodes = {
        0:{val:3,left:1,right:2}, 1:{val:9,left:null,right:3},
        2:{val:20,left:4,right:5}, 3:{val:68,left:null,right:null},
        4:{val:15,left:null,right:null}, 5:{val:7,left:null,right:null}
      };
      const valOf = id => nodes[id].val;
      const steps = [], queue = [0], result = [];
      steps.push({activeId:-1, queueIds:[...queue], result:[], lvl:[],
        msg:`BFS level-order. Enqueue root <b>3</b>. Process level by level, recording each level's values.`});
      while (queue.length) {
        const levelSize = queue.length, lvl = [];
        for (let i = 0; i < levelSize; i++) {
          const id = queue.shift(), n = nodes[id];
          lvl.push(n.val);
          const kids = [];
          if (n.left  !== null) { queue.push(n.left);  kids.push(valOf(n.left)); }
          if (n.right !== null) { queue.push(n.right); kids.push(valOf(n.right)); }
          steps.push({activeId:id, queueIds:[...queue], result:[...result], lvl:[...lvl],
            msg:`Dequeue <b>${n.val}</b>.${kids.length ? ' Enqueue children: <b>' + kids.join(', ') + '</b>.' : ' No children.'}`});
        }
        result.push([...lvl]);
        steps.push({activeId:-1, queueIds:[...queue], result:[...result], lvl:[],
          msg:`Level complete → [<b>${lvl.join(', ')}</b>]. Levels so far: ${result.map(l=>'['+l.join(',')+']').join(' · ')}`});
      }
      steps.push({activeId:-1, queueIds:[], result:[...result], lvl:[], type:'done',
        msg:`✓ Result: ${result.map(l=>'['+l.join(',')+']').join(', ')}`});
      return steps;
    },

    render(canvas, s) {
      const root = mkTree([3, 0, [9, 1, null, [68, 3]], [20, 2, [15, 4], [7, 5]]]);
      const nodeVals = {0:3,1:9,2:20,3:68,4:15,5:7};
      const treeH = renderTree(root, s.activeId, []);
      const qH = s.queueIds.length

        : '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';

        `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span style="font-size:10px;color:var(--text-muted);min-width:26px">L${i}:</span>
          ${lvl.map(v => `<span class="cell c-result" style="width:38px">${v}</span>`).join('')}
        </div>`
      ).join('') || '<span style="color:var(--text-muted);font-size:12px">(none yet)</span>';
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Tree &nbsp;(amber = current node)</div>${treeH}</div>
        <div class="ds-block"><div class="ds-label">Queue &nbsp;(front is leftmost)</div><div class="ds-row">${qH}</div></div>
        <div class="ds-block"><div class="ds-label">Result (completed levels)</div>${resH}</div>`;
    }
  },

  // ── d30 Q4 · Left View of Binary Tree (/##) ─────────────────────────────────
  "d30_leftViewOfABinaryTree": {
    title: "Left View of Binary Tree",
    day: "d30",
    section: "Tree",
    topic: "Views & Types",
    complexity: "O(N) time · O(N) space",
    lc: "",
    initial: null,

    makeSteps(_) {
      // Tree: 3(0), left=9(1), right=20(2), 9.right=68(3), 20.left=15(4), 20.right=7(5)
      const nodes = {
        0:{val:3,left:1,right:2}, 1:{val:9,left:null,right:3},
        2:{val:20,left:4,right:5}, 3:{val:68,left:null,right:null},
        4:{val:15,left:null,right:null}, 5:{val:7,left:null,right:null}
      };
      const valOf = id => nodes[id].val;
      const steps = [], queue = [0], result = [3];
      steps.push({activeId:-1, queueIds:[...queue], result:[...result], flag:false, levelNum:0,
        msg:`Root <b>3</b> always visible → add to result. Queue=[3]. BFS: per level, add the first child seen.`});
      let levelNum = 0;
      while (queue.length) {
        const levelSize = queue.length;
        let flag = false;
        levelNum++;
        for (let i = 0; i < levelSize; i++) {
          const id = queue.shift(), n = nodes[id];
          if (n.left !== null) {
            if (!flag) {
              result.push(valOf(n.left)); flag = true; queue.push(n.left);
              steps.push({activeId:n.left, queueIds:[...queue], result:[...result], flag, levelNum,
                msg:`Level ${levelNum}: first child found → <b>${valOf(n.left)}</b> (left of ${n.val}). Add to result. Set flag.`});
            } else {
              queue.push(n.left);
              steps.push({activeId:id, queueIds:[...queue], result:[...result], flag, levelNum,
                msg:`Left child <b>${valOf(n.left)}</b> of ${n.val}: flag set → enqueue only, skip result.`});
            }
          }
          if (n.right !== null) {
            if (!flag) {
              result.push(valOf(n.right)); flag = true; queue.push(n.right);
              steps.push({activeId:n.right, queueIds:[...queue], result:[...result], flag, levelNum,
                msg:`Level ${levelNum}: no left child yet → right child <b>${valOf(n.right)}</b> is leftmost. Add to result.`});
            } else {
              queue.push(n.right);
              steps.push({activeId:id, queueIds:[...queue], result:[...result], flag, levelNum,
                msg:`Right child <b>${valOf(n.right)}</b> of ${n.val}: flag set → enqueue only.`});
            }
          }
          if (n.left === null && n.right === null) {
            steps.push({activeId:id, queueIds:[...queue], result:[...result], flag, levelNum,
              msg:`Node <b>${n.val}</b> is a leaf — no children.`});
          }
        }
        if (queue.length > 0) {
          steps.push({activeId:-1, queueIds:[...queue], result:[...result], flag, levelNum,
            msg:`Level ${levelNum} done. Next queue: [${queue.map(id=>valOf(id)).join(', ')}]. Result: [${result.join(', ')}]`});
        }
      }
      steps.push({activeId:-1, queueIds:[], result:[...result], flag:false, levelNum, type:'done',
        msg:`✓ Left view: [<b>${result.join(', ')}</b>] — one node per level, leftmost visible from left.`});
      return steps;
    },

    render(canvas, s) {
      const root = mkTree([3, 0, [9, 1, null, [68, 3]], [20, 2, [15, 4], [7, 5]]]);
      const nodeVals = {0:3,1:9,2:20,3:68,4:15,5:7};
      const treeH = renderTree(root, s.activeId, []);
      const qH = s.queueIds.length
        ? s.queueIds.map(id => `<span class="cell c-input" style="width:42px">${nodeVals[id]}</span>`).join('')
        : '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';
      const resH = s.result.map(v => `<span class="cell c-result" style="width:42px">${v}</span>`).join('');
      const flagH = s.levelNum > 0
        ? (s.flag
            ? `<span style="color:var(--green);font-size:12px">✓ leftmost for level ${s.levelNum} found</span>`
            : `<span style="color:var(--text-muted);font-size:12px">scanning level ${s.levelNum}…</span>`)
        : '';
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Tree &nbsp;(amber = node added to result)</div>${treeH}</div>
        <div class="ds-block"><div class="ds-label">Queue</div><div class="ds-row">${qH}</div></div>
        ${flagH ? `<div class="ds-block"><div class="ds-label">Level flag</div>${flagH}</div>` : ''}
        <div class="ds-block"><div class="ds-label">Left View Result</div><div class="ds-row">${resH || '<span style="color:var(--text-muted);font-size:12px">—</span>'}</div></div>`;
    }
  },

        levelNum++;
        for (let i = 0; i < levelSize; i++) {

            queue.push(n.right);
            steps.push({activeId:n.right, queueIds:[...queue], result:[...result], levelNum,
              msg:`Level ${levelNum}: enqueue right child <b>${valOf(n.right)}</b> of ${n.val}. Update last.`});
          }
          if (n.left === null && n.right === null) {
            steps.push({activeId:id, queueIds:[...queue], result:[...result], levelNum,
              msg:`Node <b>${n.val}</b> is a leaf — no children.`});
          }
        }
        if (lastInLevel !== null) {
          result.push(valOf(lastInLevel));
          steps.push({activeId:lastInLevel, queueIds:[...queue], result:[...result], levelNum,
            msg:`End of level ${levelNum} → rightmost = <b>${valOf(lastInLevel)}</b>. Add to result.`});
        }
      }
      steps.push({activeId:-1, queueIds:[], result:[...result], levelNum, type:'done',
        msg:`✓ Right view: [<b>${result.join(', ')}</b>] — one node per level, rightmost visible from right.`});
      return steps;
    },

    render(canvas, s) {
      const root = mkTree([3, 0, [9, 1, null, [68, 3]], [20, 2, [15, 4], [7, 5]]]);
      const nodeVals = {0:3,1:9,2:20,3:68,4:15,5:7};
      const treeH = renderTree(root, s.activeId, []);
      const qH = s.queueIds.length
        ? s.queueIds.map(id => `<span class="cell c-input" style="width:42px">${nodeVals[id]}</span>`).join('')
        : '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';
      const resH = s.result.map(v => `<span class="cell c-result" style="width:42px">${v}</span>`).join('');
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Tree &nbsp;(amber = candidate for right view)</div>${treeH}</div>
        <div class="ds-block"><div class="ds-label">Queue</div><div class="ds-row">${qH}</div></div>
        <div class="ds-block"><div class="ds-label">Right View Result</div><div class="ds-row">${resH || '<span style="color:var(--text-muted);font-size:12px">—</span>'}</div></div>`;
    }
  },

  // ── d30 AQ2 · Serialize Binary Tree (/##) ───────────────────────────────────
  "d30_serialize": {
    title: "Serialize Binary Tree",
    day: "d30",
    section: "Tree",
    topic: "Views & Types",
    complexity: "O(N) time · O(N) space",
    lc: "LC 297",
    initial: null,

    makeSteps(_) {
      // Tree: 1(0), left=2(1), right=3(2), 2.left=4(3)
      const nodes = {
        0:{val:1,left:1,right:2}, 1:{val:2,left:3,right:null},
        2:{val:3,left:null,right:null}, 3:{val:4,left:null,right:null}
      };
      const valOf = id => nodes[id]?.val ?? '∅';
      const steps = [], queue = [0], result = [];
      steps.push({activeId:-1, queueIds:[...queue], result:[], 
        msg:`BFS serialization: enqueue root. Dequeue node: add val (or -1 for null), enqueue both children (even nulls).`});
      
      while (queue.length && result.length < 8) { // limit for demo
        const id = queue.shift();
        if (id === null) {
          result.push(-1);
          steps.push({activeId:-1, queueIds:[...queue], result:[...result],
            msg:`Dequeue <b>null</b> → add <b>-1</b> to result. Don't enqueue children.`});
        } else {
          const n = nodes[id];
          result.push(n.val);
          steps.push({activeId:id, queueIds:[...queue], result:[...result],
            msg:`Dequeue node <b>${n.val}</b> → add <b>${n.val}</b>. Enqueue left=${valOf(n.left)}, right=${valOf(n.right)}.`});
          queue.push(n.left);
          queue.push(n.right);
        }
      }
      steps.push({activeId:-1, queueIds:[], result:[...result], type:'done',
        msg:`✓ Serialized: [<b>${result.join(', ')}</b>] — level-order with -1 for null nodes.`});
      return steps;
    },

    render(canvas, s) {
      const root = mkTree([1, 0, [2, 1, [4, 3], null], [3, 2]]);
      const treeH = renderTree(root, s.activeId, []);
      const qH = s.queueIds.length
        ? s.queueIds.map(id => id === null ? `<span class="cell c-empty">∅</span>` : `<span class="cell c-input" style="width:42px">${[1,2,3,4][id]}</span>`).join('')
        : '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';
      const resH = s.result.map(v => `<span class="cell ${v===-1?'c-empty':'c-result'}" style="width:42px">${v===-1?'-1':v}</span>`).join('');
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Tree</div>${treeH}</div>
        <div class="ds-block"><div class="ds-label">Queue</div><div class="ds-row">${qH}</div></div>
        <div class="ds-block"><div class="ds-label">Serialized Array</div><div class="ds-row">${resH || '<span style="color:var(--text-muted);font-size:12px">—</span>'}</div></div>`;
    }
  },

  // ── d30 AQ3 · Deserialize Binary Tree (/##) ─────────────────────────────────
  "d30_deserialize": {
    title: "Deserialize Binary Tree",
    day: "d30",
    section: "Tree",
    topic: "Views & Types",
    complexity: "O(N) time · O(N) space",
    lc: "LC 297",
    initial: null,

    makeSteps(_) {
      // Array: [1,2,3,4,-1,-1,-1] → reconstructs tree
      const A = [1,2,3,4,-1,-1,-1];
      const steps = [];
      steps.push({builtIds:[], activeId:-1, i:0, queueIds:[], phase:'init',
        msg:`Array=[1,2,3,4,-1,-1,-1]. Create root=A[0]=<b>1</b>, enqueue it. i=1.`});
      const queue = [0]; // ids
      const nodes = {0:{val:1,id:0}};
      let nextId = 1, i = 1;
      steps.push({builtIds:[0], activeId:0, i:1, queueIds:[...queue], phase:'build',
        msg:`Dequeue node <b>1</b>. A[1]=<b>2</b> → create left child, enqueue. A[2]=<b>3</b> → create right child, enqueue. i=3.`});
      nodes[1] = {val:2,id:1}; nodes[2] = {val:3,id:2};
      queue.shift(); queue.push(1); queue.push(2); i=3;
      steps.push({builtIds:[0,1,2], activeId:1, i:3, queueIds:[...queue], phase:'build',
        msg:`Dequeue node <b>2</b>. A[3]=<b>4</b> → create left child, enqueue. A[4]=<b>-1</b> → null right child. i=5.`});
      nodes[3] = {val:4,id:3};
      queue.shift(); queue.push(3); i=5;
      steps.push({builtIds:[0,1,2,3], activeId:2, i:5, queueIds:[...queue], phase:'build',
        msg:`Dequeue node <b>3</b>. A[5]=<b>-1</b> → null left. A[6]=<b>-1</b> → null right. i=7. Queue=[4].`});
      queue.shift(); i=7;
      steps.push({builtIds:[0,1,2,3], activeId:3, i:7, queueIds:[3], phase:'build',
        msg:`Dequeue node <b>4</b>. i≥N → done. Tree reconstructed.`});
      steps.push({builtIds:[0,1,2,3], activeId:-1, i:7, queueIds:[], phase:'done', type:'done',
        msg:`✓ Tree deserialized from [1,2,3,4,-1,-1,-1]. Key: only enqueue non-null nodes.`});
      return steps;
    },

    render(canvas, s) {
      const root = mkTree([1, 0, [2, 1, [4, 3], null], [3, 2]]);
      const treeH = renderTree(root, s.activeId, s.builtIds);
      const A = [1,2,3,4,-1,-1,-1];
      const arrH = A.map((v, idx) => `<span class="cell ${idx<s.i?(v===-1?'c-empty':'c-result'):'c-input'}" style="width:42px">${v===-1?'-1':v}</span>`).join('');
      const qH = s.queueIds.length
        ? s.queueIds.map(id => `<span class="cell c-input" style="width:42px">${[1,2,3,4][id]}</span>`).join('')
        : '<span style="color:var(--text-muted);font-size:12px">(empty)</span>';
      canvas.innerHTML = `
        <div class="ds-block"><div class="ds-label">Serialized Array &nbsp;(i=${s.i})</div><div class="ds-row">${arrH}</div></div>
        <div class="ds-block"><div class="ds-label">Queue &nbsp;(node values)</div><div class="ds-row">${qH}</div></div>
        <div class="ds-block"><div class="ds-label">Reconstructed Tree &nbsp;(green=built · amber=current)</div>${treeH}</div>`;
    }
  },

  // ── d31 Q1 · Validate BST (/## · LC98) ──────────────────────────────────────
  "d31_isValidBST": {
    title: "Validate BST",
    day: "d31",
    section: "Tree",
    topic: "BST",
    complexity: "O(N) time · O(H) space",
    lc: "LC 98",
    initial: null,

    makeSteps(_) {
      // Tree: 5(0), left=3(1), right=6(2), 3.right=7(3) — 7 violates upper bound (>5 in left subtree)
      return [
        { activeId: -1, visitedIds: [], pathIds: [], labels: {}, result: null,
          msg: 'isValidBST: DFS passing <b>(min, max)</b> bounds down. Every node must satisfy <code>min &lt; val &lt; max</code>. This tree has a hidden violation.' },
        { activeId: 0, visitedIds: [], pathIds: [], labels: {0:'(MIN,MAX)'}, result: null,
          msg: 'Visit root <b>5</b>. Bounds = (MIN, MAX). 5 is in range. Recurse left with (MIN, 4), right with (6, MAX).' },
        { activeId: 1, visitedIds: [], pathIds: [], labels: {0:'(MIN,MAX)', 1:'(MIN,4)'}, result: null,
          msg: 'Visit <b>3</b>. Bounds = (MIN, 4). 3 ≤ 4 ✓. Left → null → true. Recurse right with (4, 4).' },
        { activeId: 3, visitedIds: [], pathIds: [3], labels: {0:'(MIN,MAX)', 1:'(MIN,4)', 3:'7 &gt; 4 ❌'}, result: null,
          msg: 'Visit <b>7</b>. Bounds = (4, 4). But 7 &gt; 4 — <b>violates upper bound!</b> Return <b>false</b> immediately.' },
        { activeId: 1, visitedIds: [], pathIds: [3, 1], labels: {0:'(MIN,MAX)', 1:'✗ false', 3:'7&gt;4 ❌'}, result: null,
          msg: 'Node <b>3</b>: right subtree returned false → propagate false upward.' },
        { activeId: -1, visitedIds: [], pathIds: [3, 1, 0], labels: {0:'✗ false', 1:'✗ false', 3:'❌ violates'}, result: false, type: 'done',
          msg: '✓ isValidBST = <b>false</b>. Node 7 is right child of 3 (left subtree of root 5) — 7 &gt; 5 breaks BST ordering. Always use <b>long</b> bounds to handle Integer.MIN/MAX_VALUE nodes.' }
      ];
    },

    render(canvas, s) {
      const root = mkTree([5, 0, [3, 1, null, [7, 3]], [6, 2]]);
      const treeH = renderTree(root, s.activeId, s.visitedIds, s.pathIds, s.labels);
      const badge = s.result !== null
        ? `<div style="margin-top:10px;font-size:14px;font-weight:700;color:var(--red)">✗ Not a valid BST</div>`
        : s.activeId >= 0
          ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px">Checking bounds…</div>`
          : '';
      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">BST Validation &nbsp;(labels = active bounds · purple = violation path)</div>
          ${treeH}${badge}
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--text-muted);background:var(--bg-card);
          border:1px solid var(--border);border-radius:6px;padding:10px 14px;
          font-family:'JetBrains Mono',monospace;line-height:1.8">
          Use <b>long</b> bounds &nbsp;·&nbsp; left → (min, node.val−1) &nbsp;·&nbsp; right → (node.val+1, max)
        </div>`;
    }
  },

  // ── d31 Q4 · Search in BST (/## · LC700) ────────────────────────────────────
  "d31_searchInABST": {
    title: "Search in BST",
    day: "d31",
    section: "Tree",
    topic: "BST",
    complexity: "O(H) time · O(H) space",
    lc: "LC 700",
    initial: null,

    makeSteps(_) {
      // Tree: 5(0), left=3(1), right=6(2), 3.left=2(3), 3.right=4(4). Search for B=4.
      return [
        { activeId: -1, visitedIds: [], pathIds: [], target: 4, result: null,
          msg: 'searchInABST: target = <b>4</b>. BST property: if val == target → found; target &lt; val → go left; target &gt; val → go right.' },
        { activeId: 0, visitedIds: [], pathIds: [], target: 4, result: null,
          msg: 'At root <b>5</b>. Is 4 == 5? No. 4 &lt; 5 → go <b>left</b>.' },
        { activeId: 1, visitedIds: [0], pathIds: [], target: 4, result: null,
          msg: 'At node <b>3</b>. Is 4 == 3? No. 4 &gt; 3 → go <b>right</b>.' },
        { activeId: -1, visitedIds: [0, 1], pathIds: [4], target: 4, result: 1, type: 'done',
          msg: 'At node <b>4</b>. Is 4 == 4? <b>Yes!</b> Return <b>1</b>. (3 comparisons = O(H) depth)' }
      ];
    },

    render(canvas, s) {
      const root = mkTree([5, 0, [3, 1, [2, 3], [4, 4]], [6, 2]]);
      const treeH = renderTree(root, s.activeId, s.visitedIds, s.pathIds);
      const badge = s.result !== null
        ? `<div style="margin-top:10px;font-size:14px;font-weight:700;color:var(--green)">✓ Found — return 1</div>`
        : s.activeId >= 0
          ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px">Searching for <b>${s.target}</b>…</div>`
          : `<div style="font-size:12px;color:var(--text-muted);margin-top:8px">Target = <b>${s.target}</b></div>`;
      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">BST Search &nbsp;(target = ${s.target} · green = visited · purple = found)</div>
          ${treeH}
          ${badge}
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--text-muted);background:var(--bg-card);
          border:1px solid var(--border);border-radius:6px;padding:10px 14px;
          font-family:'JetBrains Mono',monospace;line-height:1.8">
          if val == B → return 1 &nbsp;·&nbsp; val &gt; B → recurse left &nbsp;·&nbsp; val &lt; B → recurse right
        </div>`;
    }
  },

  // ── d31 Q2 · Sorted Array → BST (/## · LC108) ───────────────────────────────
  "d31_sortedArrayToBST": {
    title: "Sorted Array → Balanced BST",
    day: "d31",
    section: "Tree",
    topic: "BST",
    complexity: "O(N) time · O(N) space",
    lc: "LC 108",
    initial: null,

    makeSteps(_) {
      // A=[1,2,3,4,5,6] → tree: 3(0), 1(1,right=2(2)), 5(3,left=4(4),right=6(5))
      const A = [1, 2, 3, 4, 5, 6];
      return [
        { builtIds: [], activeId: -1, lo: -1, hi: -1, mid: -1,
          msg: 'sortedArrayToBST: pick <b>mid</b> as root to guarantee balanced height (like binary search). Recurse left half → left subtree; right half → right subtree.' },
        { builtIds: [], activeId: 0, lo: 0, hi: 5, mid: 2,
          msg: 'convert([0..5]): mid = (0+5)/2 = <b>2</b>. Root = a[2] = <b>3</b>. Recurse left [0..1], right [3..5].' },
        { builtIds: [0], activeId: 1, lo: 0, hi: 1, mid: 0,
          msg: 'convert([0..1]) — left of 3: mid = (0+1)/2 = <b>0</b>. Root = a[0] = <b>1</b>. Recurse left [0..-1]=null, right [1..1].' },
        { builtIds: [0, 1], activeId: 2, lo: 1, hi: 1, mid: 1,
          msg: 'convert([1..1]) — right of 1: mid = <b>1</b>. Root = a[1] = <b>2</b>. l == r → leaf node, both children null.' },
        { builtIds: [0, 1, 2], activeId: 3, lo: 3, hi: 5, mid: 4,
          msg: 'convert([3..5]) — right of 3: mid = (3+5)/2 = <b>4</b>. Root = a[4] = <b>5</b>. Recurse left [3..3], right [5..5].' },
        { builtIds: [0, 1, 2, 3], activeId: 4, lo: 3, hi: 3, mid: 3,
          msg: 'convert([3..3]) — left of 5: mid = <b>3</b>. Root = a[3] = <b>4</b>. Leaf node.' },
        { builtIds: [0, 1, 2, 3, 4], activeId: 5, lo: 5, hi: 5, mid: 5,
          msg: 'convert([5..5]) — right of 5: mid = <b>5</b>. Root = a[5] = <b>6</b>. Leaf node.' },
        { builtIds: [0, 1, 2, 3, 4, 5], activeId: -1, lo: -1, hi: -1, mid: -1, type: 'done',
          msg: '✓ Balanced BST built. Root = 3. Height = 3. Inorder traversal gives back [1,2,3,4,5,6] ✓' }
      ];
    },

    render(canvas, s) {
      const A = [1, 2, 3, 4, 5, 6];
      const arrH = A.map((v, i) => {
        if (s.lo < 0) return cell(v, 'c-input');
        if (i === s.mid) return cell(v, 'c-active');
        if (i >= s.lo && i <= s.hi) return cell(v, 'c-input');
        return cell(v, 'c-empty');
      }).join('');

      // 3(0), left=1(1,right=2(2)), right=5(3,left=4(4),right=6(5))
      const root = mkTree([3, 0, [1, 1, null, [2, 2]], [5, 3, [4, 4], [6, 5]]]);
      const treeH = renderTree(root, s.activeId, s.builtIds);

      canvas.innerHTML = `
        <div class="ds-block">
          <div class="ds-label">Sorted Array &nbsp;(amber = mid/new root · grey = outside active range)</div>
          <div class="ds-row">${arrH}</div>
          ${s.lo >= 0 ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-family:'JetBrains Mono',monospace">range [${s.lo}..${s.hi}] &nbsp;·&nbsp; mid=${s.mid} &nbsp;·&nbsp; a[${s.mid}]=${A[s.mid]}</div>` : ''}
        </div>
        <div class="ds-block">
          <div class="ds-label">BST Being Built &nbsp;(green = done · amber = current root)</div>
          ${treeH}
        </div>`;
    }
  }

};

// ─── Shell ────────────────────────────────────────────────────────────────────
let currentKey = null, steps = [], stepIdx = 0;
let _sec = 'All', _top = 'All';

function _sections() {
  const s = new Set(['All']);
  Object.values(PROBLEMS).forEach(p => s.add(p.section || 'Other'));
  return [...s];
}
function _topics(section) {
  const s = new Set(['All']);
  Object.values(PROBLEMS)
    .filter(p => section === 'All' || (p.section || 'Other') === section)
    .forEach(p => s.add(p.topic));
  return [...s];
}

function renderTopicBar() {
  const bar = document.getElementById('topic-bar');
  let html = '<div class="filter-row">';
  _sections().forEach(sec => {
    html += `<button class="topic-pill sec-pill${sec === _sec ? ' active' : ''}" onclick="_secClick('${sec}')">${sec}</button>`;
  });
  html += '</div>';
  const tops = _topics(_sec);
  if (tops.length > 2) {
    html += '<div class="filter-row topic-row">';
    tops.forEach(top => {
      html += `<button class="topic-pill${top === _top ? ' active' : ''}" onclick="_topClick('${top}')">${top}</button>`;
    });
    html += '</div>';
  }
  bar.innerHTML = html;
}

function _secClick(sec) { _sec = sec; _top = 'All'; renderTopicBar(); renderProblemList(); }
function _topClick(top) { _top = top; renderTopicBar(); renderProblemList(); }

function renderProblemList() {
  const list = document.getElementById('prob-list');
  list.innerHTML = '';
  Object.entries(PROBLEMS)
    .filter(([, p]) =>
      (_sec === 'All' || (p.section || 'Other') === _sec) &&
      (_top === 'All' || p.topic === _top)
    )
    .forEach(([key, p]) => {
      const card = document.createElement('div');
      card.className = 'prob-card' + (key === currentKey ? ' selected' : '');
      card.innerHTML = `
        <div class="prob-day">${p.day} &nbsp;·&nbsp; ${p.lc}</div>
        <div class="prob-name">${p.title}</div>
        <div class="prob-meta">${p.topic} · ${p.complexity.split('·')[0].trim()}</div>`;
      card.onclick = function() { loadProblem(key, this); };
      list.appendChild(card);
    });
}

function loadProblem(key, cardEl) {
  currentKey = key;
  const p = PROBLEMS[key];
  steps = p.makeSteps(p.initial);
  stepIdx = 0;

  const panel = document.getElementById('viz-panel');
  panel.innerHTML = `
    <div class="prob-sub">${p.title} &nbsp;·&nbsp; ${p.day} &nbsp;·&nbsp; ${p.lc}</div>
    <div id="viz-canvas"></div>
    <div id="explanation">Press <strong>Start</strong> to begin.</div>
    <div id="controls">
      <button id="btn-start">▶ Start</button>
      <button id="btn-step" disabled>Step →</button>
      <button id="btn-reset">↺ Reset</button>
    </div>
    <div class="complexity-footer">${p.complexity}</div>`;

  document.getElementById('btn-start').onclick = () => {
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-step').disabled = false;
    applyStep(steps[stepIdx++]);
  };
  document.getElementById('btn-step').onclick = () => {
    if (stepIdx < steps.length) applyStep(steps[stepIdx++]);
    if (stepIdx >= steps.length) document.getElementById('btn-step').disabled = true;
  };
  document.getElementById('btn-reset').onclick = () => {
    steps = p.makeSteps(p.initial); stepIdx = 0;
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-step').disabled = true;
    document.getElementById('viz-canvas').innerHTML = '';
    document.getElementById('explanation').innerHTML = 'Press <strong>Start</strong> to begin.';
  };

  document.querySelectorAll('.prob-card').forEach(c => c.classList.remove('selected'));
  if (cardEl) cardEl.classList.add('selected');
}

function applyStep(s) {
  PROBLEMS[currentKey].render(document.getElementById('viz-canvas'), s);
  document.getElementById('explanation').innerHTML = s.msg;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderTopicBar();
renderProblemList();
</script>
