<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Problem Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 50%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 95, 109, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(72, 219, 251, 0.2) 0%, transparent 50%);
            pointer-events: none;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            font-size: 3.5em;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 0 40px rgba(102, 126, 234, 0.5);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(102, 126, 234, 0.5)); }
            50% { filter: brightness(1.2) drop-shadow(0 0 30px rgba(102, 126, 234, 0.8)); }
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }

        .button-group.hidden {
            display: none;
        }

        button {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-load {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
            z-index: 1;
        }

        .btn-load:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn-complexity {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-complexity:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.6);
        }

        .btn-approach {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-approach:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
        }

        .btn-topic {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .btn-topic:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(67, 233, 123, 0.6);
        }

        .content-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 25px;
            display: none;
            animation: slideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .content-section.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .section-title {
            font-size: 1.8em;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            padding-bottom: 15px;
            position: relative;
            font-weight: 800;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.6);
        }

        .problem-title {
            font-size: 2.2em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            font-weight: 900;
            line-height: 1.3;
        }

        .problem-description {
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 25px;
            font-size: 1.05em;
            white-space: pre-line;
        }

        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 25px;
        }

        .io-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .io-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
        }

        .io-box:hover {
            border-color: rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .io-title {
            font-weight: 800;
            color: #4facfe;
            margin-bottom: 12px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .io-content {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            color: #43e97b;
            border: 1px solid rgba(67, 233, 123, 0.2);
            line-height: 1.6;
        }

        .complexity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .complexity-box {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .complexity-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .complexity-box:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .complexity-label {
            font-weight: 800;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9em;
            position: relative;
            z-index: 1;
        }

        .complexity-value {
            font-size: 2.2em;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            position: relative;
            z-index: 1;
        }

        .approach-steps {
            list-style: none;
            counter-reset: step-counter;
        }

        .approach-steps li {
            background: rgba(79, 172, 254, 0.1);
            padding: 20px 20px 20px 70px;
            margin-bottom: 15px;
            border-radius: 16px;
            border: 2px solid rgba(79, 172, 254, 0.3);
            position: relative;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.7;
            transition: all 0.3s ease;
            counter-increment: step-counter;
        }

        .approach-steps li::before {
            content: counter(step-counter);
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1em;
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.5);
        }

        .approach-steps li:hover {
            transform: translateX(10px);
            border-color: rgba(79, 172, 254, 0.6);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.3);
        }

        .topic-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        .tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tag:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #topicDescription {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.8;
            font-size: 1.05em;
            margin-bottom: 20px;
        }

        .no-problem {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 60px;
            font-size: 1.3em;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            .container { padding: 25px; }
            .button-group { gap: 12px; }
            button { padding: 12px 24px; font-size: 14px; }
            .io-container { grid-template-columns: 1fr; }
            .complexity-grid { grid-template-columns: 1fr; }
            .filter-input { min-width: 200px; }
        }

        .practice-mode-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .practice-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 2px solid rgba(240, 147, 251, 0.3);
            transition: all 0.3s ease;
        }

        .practice-checkbox:hover {
            border-color: rgba(240, 147, 251, 0.6);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.2);
        }

        .practice-checkbox input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #f093fb;
        }

        .practice-checkbox label {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-buttons {
            display: none;
            gap: 15px;
        }

        .nav-buttons.active {
            display: flex;
        }

        .btn-nav {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 106, 136, 0.3);
        }

        .btn-nav:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 106, 136, 0.5);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .problem-progress {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            font-size: 15px;
            background: rgba(240, 147, 251, 0.2);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(240, 147, 251, 0.3);
        }

        .filter-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .filter-label {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-input {
            padding: 14px 24px;
            font-size: 16px;
            border: 2px solid rgba(67, 233, 123, 0.4);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            cursor: text;
            outline: none;
            transition: all 0.3s ease;
            min-width: 350px;
        }

        .filter-input:hover {
            border-color: rgba(67, 233, 123, 0.6);
            box-shadow: 0 4px 20px rgba(67, 233, 123, 0.2);
        }

        .filter-input:focus {
            border-color: #43e97b;
            box-shadow: 0 0 0 4px rgba(67, 233, 123, 0.2);
            transform: scale(1.02);
        }

        .filter-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        .problem-count {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Random Problem Viewer</h1>
        
        <div class="filter-section">
            <label class="filter-label">Filter by Topic:</label>
            <input type="text" id="topicFilter" class="filter-input" 
                   list="topicList" 
                   placeholder="Type to search or select 'All Topics'..."
                   oninput="updateProblemCount()" 
                   autocomplete="off">
            <datalist id="topicList">
                <option value="All Topics">
            </datalist>
            <span class="problem-count" id="problemCount"></span>
        </div>

        <div class="practice-mode-section">
            <div class="practice-checkbox">
                <input type="checkbox" id="practiceAllCheckbox" onchange="togglePracticeMode()">
                <label for="practiceAllCheckbox">Practice All</label>
            </div>
            <div class="nav-buttons" id="navButtons">
                <button class="btn-nav" id="prevBtn" onclick="previousProblem()">← Previous</button>
                <span class="problem-progress" id="problemProgress"></span>
                <button class="btn-nav" id="nextBtn" onclick="nextProblem()">Next →</button>
            </div>
        </div>
        
        <div class="button-group" id="loadButtonGroup">
            <button class="btn-load" onclick="loadProblem()">Load Problem</button>
        </div>

        <div class="button-group" id="actionButtonGroup">
            <button class="btn-complexity" onclick="showComplexity()">Complexity</button>
            <button class="btn-approach" onclick="showApproach()">Approach</button>
            <button class="btn-topic" onclick="showTopic()">Topic</button>
        </div>

        <div id="problemSection" class="content-section">
            <div class="problem-title" id="problemTitle"></div>
            <div class="problem-description" id="problemDescription"></div>
            <div class="io-container">
                <div class="io-box">
                    <div class="io-title">📥 Sample Input</div>
                    <div class="io-content" id="sampleInput"></div>
                </div>
                <div class="io-box">
                    <div class="io-title">📤 Sample Output</div>
                    <div class="io-content" id="sampleOutput"></div>
                </div>
            </div>
        </div>

        <div id="complexitySection" class="content-section">
            <div class="section-title">⏱️ Complexity Analysis</div>
            <div class="complexity-grid">
                <div class="complexity-box">
                    <div class="complexity-label">Time Complexity</div>
                    <div class="complexity-value" id="timeComplexity"></div>
                </div>
                <div class="complexity-box">
                    <div class="complexity-label">Space Complexity</div>
                    <div class="complexity-value" id="spaceComplexity"></div>
                </div>
            </div>
        </div>

        <div id="approachSection" class="content-section">
            <div class="section-title">💡 Approach</div>
            <ol class="approach-steps" id="approachSteps"></ol>
        </div>

        <div id="topicSection" class="content-section">
            <div class="section-title">📚 Topic</div>
            <div id="topicDescription"></div>
            <div class="topic-tags" id="topicTags"></div>
        </div>
    </div>

    <script>
        // Problem data structure - will be populated with actual problems
        const problems = [
            {
                title: "Find Left Most and Right Most Index of Element",
                description: "Given a sorted array of integers A (0-indexed) of size N, find the left most and the right most index of a given integer B in the array A.\n\nReturn an array of size 2, such that:\n• First element = Left most index of B in A\n• Second element = Right most index of B in A\n\nIf B is not found in A, return [-1, -1].\n\nNote: The time complexity of your algorithm must be O(log n).",
                sampleInput: "A = [5, 7, 7, 8, 8, 10]\nB = 8",
                sampleOutput: "[3, 4]\n\nExplanation: The first occurrence of 8 is at index 3 and the last occurrence is at index 4.",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Use Binary Search twice - once to find the leftmost occurrence and once for the rightmost",
                    "For leftmost: When target is found, continue searching in the left half to find earlier occurrence",
                    "For rightmost: When target is found, continue searching in the right half to find later occurrence",
                    "Handle edge cases: element not found, single element, all elements same",
                    "Return [-1, -1] if element not found, otherwise return [leftIndex, rightIndex]"
                ],
                topic: "Binary Search on sorted arrays to find boundaries of a target element. This is a classic problem that demonstrates how binary search can be modified to find not just any occurrence, but specific occurrences (first/last) of a target value.",
                tags: ["Binary Search", "Arrays", "Sorted Array", "Search Boundaries"]
            },
            {
                title: "Search Insert Position (Lower Bound)",
                description: "You are given a sorted array A of size N and a target value B. Your task is to find the index (0-based indexing) of the target value in the array.\n\n• If the target value is present, return its index\n• If the target value is not found, return the index of least element greater than or equal to B\n• If the target value is not found and least number greater than or equal to target is also not present, return the length of array (i.e. the position where target can be placed)\n\nConstraints:\n• 1 <= N <= 10^5\n• 1 <= A[i] <= 10^5\n• 1 <= B <= 10^5\n\nTime complexity must be O(log N).",
                sampleInput: "Input 1:\nA = [1, 3, 5, 6]\nB = 5\n\nInput 2:\nA = [1, 4, 9]\nB = 3",
                sampleOutput: "Output 1: 2\n(5 is found at index 2)\n\nOutput 2: 1\n(3 is not found, smallest element >= 3 is 4 at index 1)",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Use modified Binary Search to find the lower bound (smallest index where element >= target)",
                    "Initialize low = 0, high = N-1, ans = N (default if all elements are smaller)",
                    "At each mid: if A[mid] >= B, update ans = mid and search left half (high = mid - 1)",
                    "If A[mid] < B, search right half (low = mid + 1)",
                    "The answer will be the leftmost position where we can insert B to keep array sorted"
                ],
                topic: "Binary Search - Lower Bound (Ceiling). This problem teaches finding the insertion position in a sorted array, which is equivalent to finding the lower bound or ceiling element. It's a fundamental pattern used in many advanced algorithms.",
                tags: ["Binary Search", "Lower Bound", "Sorted Array", "Search Insert Position"]
            },
            {
                title: "Single Element in Sorted Array",
                description: "Given a sorted array of integers A where every element appears twice except for one element which appears once, find and return this single element that appears only once.\n\nElements which are appearing twice are adjacent to each other.\n\nConstraints:\n• 1 <= |A| <= 100000\n• 1 <= A[i] <= 10^9\n\nNOTE: Users are expected to solve this in O(log(N)) time.",
                sampleInput: "Input 1:\nA = [1, 1, 7]\n\nInput 2:\nA = [2, 3, 3]",
                sampleOutput: "Output 1: 7\n(7 appears only once)\n\nOutput 2: 2\n(2 appears only once)",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Key insight: Before the single element, pairs start at even indices (0,1), (2,3), etc.",
                    "After the single element, pairs start at odd indices",
                    "Use Binary Search: Check if mid is at even or odd index",
                    "If mid is even and A[mid] == A[mid+1], single element is on right → low = mid + 2",
                    "If mid is even and A[mid] != A[mid+1], single element is on left → high = mid",
                    "If mid is odd, adjust accordingly. Continue until low == high"
                ],
                topic: "Binary Search on pattern recognition. This problem uses binary search not to find a target value, but to find where a pattern breaks. Before the single element, pairs align differently than after it.",
                tags: ["Binary Search", "Pattern Recognition", "Sorted Array", "XOR Alternative"]
            },
            {
                title: "Find a Peak Element",
                description: "Given an array of integers A, find and return the peak element in it.\n\nAn array element is considered a peak if it is not smaller than its neighbors. For corner elements, we need to consider only one neighbor.\n\nConstraints:\n• 1 <= |A| <= 100000\n• 1 <= A[i] <= 10^9\n\nNOTE:\n• It is guaranteed that the array contains only a single peak element\n• Users are expected to solve this in O(log(N)) time\n• The array may contain duplicate elements",
                sampleInput: "Input 1:\nA = [1, 2, 3, 4, 5]\n\nInput 2:\nA = [5, 17, 100, 11]",
                sampleOutput: "Output 1: 5\n(5 is greater than its only neighbor 4)\n\nOutput 2: 100\n(100 is greater than both neighbors 17 and 11)",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Use Binary Search to navigate towards increasing slope",
                    "At mid, check if A[mid] > A[mid-1] and A[mid] > A[mid+1] → peak found",
                    "If A[mid] < A[mid+1], peak must be on right side → low = mid + 1",
                    "If A[mid] < A[mid-1], peak must be on left side → high = mid - 1",
                    "Handle edge cases: first and last elements (check only one neighbor)"
                ],
                topic: "Binary Search on unimodal functions. Instead of searching for a specific value, we search for a property (peak). By always moving towards the increasing slope, we're guaranteed to find a peak.",
                tags: ["Binary Search", "Peak Finding", "Unimodal", "Gradient Descent"]
            }
        ];

        let currentProblem = null;
        let practiceMode = false;
        let currentPracticeIndex = 0;
        let practiceProblems = [];

        // Initialize topic filter on page load
        window.onload = function() {
            populateTopicFilter();
            updateProblemCount();
        };

        function togglePracticeMode() {
            practiceMode = document.getElementById('practiceAllCheckbox').checked;
            const navButtons = document.getElementById('navButtons');
            const loadButtonGroup = document.getElementById('loadButtonGroup');
            
            if (practiceMode) {
                practiceProblems = getFilteredProblems();
                if (practiceProblems.length === 0) {
                    alert("No problems available for the selected topic.");
                    document.getElementById('practiceAllCheckbox').checked = false;
                    practiceMode = false;
                    return;
                }
                currentPracticeIndex = 0;
                navButtons.classList.add('active');
                loadButtonGroup.classList.add('hidden');
                loadProblemAtIndex(0);
            } else {
                navButtons.classList.remove('active');
                loadButtonGroup.classList.remove('hidden');
                hideAllSections();
            }
        }

        function loadProblemAtIndex(index) {
            if (index < 0 || index >= practiceProblems.length) return;
            
            currentPracticeIndex = index;
            currentProblem = practiceProblems[index];

            // Update problem section
            document.getElementById('problemTitle').textContent = currentProblem.title;
            document.getElementById('problemDescription').textContent = currentProblem.description;
            document.getElementById('sampleInput').textContent = currentProblem.sampleInput;
            document.getElementById('sampleOutput').textContent = currentProblem.sampleOutput;

            // Update progress
            document.getElementById('problemProgress').textContent = 
                `${index + 1} / ${practiceProblems.length}`;

            // Update button states
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === practiceProblems.length - 1);

            // Show problem section and hide others
            hideAllSections();
            document.getElementById('problemSection').classList.add('active');
        }

        function previousProblem() {
            if (currentPracticeIndex > 0) {
                loadProblemAtIndex(currentPracticeIndex - 1);
            }
        }

        function nextProblem() {
            if (currentPracticeIndex < practiceProblems.length - 1) {
                loadProblemAtIndex(currentPracticeIndex + 1);
            }
        }

        function populateTopicFilter() {
            const topicSet = new Set();
            problems.forEach(problem => {
                problem.tags.forEach(tag => topicSet.add(tag));
            });
            
            const topicList = document.getElementById('topicList');
            const sortedTopics = Array.from(topicSet).sort();
            
            sortedTopics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                topicList.appendChild(option);
            });
        }

        function getFilteredProblems() {
            const selectedTopic = document.getElementById('topicFilter').value.trim();
            
            if (selectedTopic === '' || selectedTopic.toLowerCase() === 'all topics') {
                return problems;
            }
            
            return problems.filter(problem => 
                problem.tags.some(tag => tag.toLowerCase().includes(selectedTopic.toLowerCase()))
            );
        }

        function updateProblemCount() {
            const filteredProblems = getFilteredProblems();
            const countElement = document.getElementById('problemCount');
            countElement.textContent = `(${filteredProblems.length} problem${filteredProblems.length !== 1 ? 's' : ''})`;
        }

        function loadProblem() {
            const filteredProblems = getFilteredProblems();
            
            if (filteredProblems.length === 0) {
                alert("No problems available for the selected topic.");
                return;
            }

            // Select a random problem from filtered list
            const randomIndex = Math.floor(Math.random() * filteredProblems.length);
            currentProblem = filteredProblems[randomIndex];

            // Update problem section
            document.getElementById('problemTitle').textContent = currentProblem.title;
            document.getElementById('problemDescription').textContent = currentProblem.description;
            document.getElementById('sampleInput').textContent = currentProblem.sampleInput;
            document.getElementById('sampleOutput').textContent = currentProblem.sampleOutput;

            // Show problem section and hide others
            hideAllSections();
            document.getElementById('problemSection').classList.add('active');
        }

        function showComplexity() {
            if (!currentProblem) {
                alert("Please load a problem first!");
                return;
            }

            document.getElementById('timeComplexity').textContent = currentProblem.timeComplexity;
            document.getElementById('spaceComplexity').textContent = currentProblem.spaceComplexity;

            hideInfoSections();
            document.getElementById('problemSection').classList.add('active');
            document.getElementById('complexitySection').classList.add('active');
        }

        function showApproach() {
            if (!currentProblem) {
                alert("Please load a problem first!");
                return;
            }

            const approachSteps = document.getElementById('approachSteps');
            approachSteps.innerHTML = '';
            
            currentProblem.approach.forEach(step => {
                const li = document.createElement('li');
                li.textContent = step;
                approachSteps.appendChild(li);
            });

            hideInfoSections();
            document.getElementById('problemSection').classList.add('active');
            document.getElementById('approachSection').classList.add('active');
        }

        function showTopic() {
            if (!currentProblem) {
                alert("Please load a problem first!");
                return;
            }

            document.getElementById('topicDescription').textContent = currentProblem.topic;
            
            const topicTags = document.getElementById('topicTags');
            topicTags.innerHTML = '';
            
            currentProblem.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.textContent = tag;
                topicTags.appendChild(span);
            });

            hideInfoSections();
            document.getElementById('problemSection').classList.add('active');
            document.getElementById('topicSection').classList.add('active');
        }

        function hideInfoSections() {
            document.getElementById('complexitySection').classList.remove('active');
            document.getElementById('approachSection').classList.remove('active');
            document.getElementById('topicSection').classList.remove('active');
        }

        function hideAllSections() {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
        }
    </script>
</body>
</html>
