<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Problem Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-load {
            background: #667eea;
            color: white;
        }

        .btn-load:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-complexity {
            background: #f093fb;
            color: white;
        }

        .btn-complexity:hover {
            background: #d67ae0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .btn-approach {
            background: #4facfe;
            color: white;
        }

        .btn-approach:hover {
            background: #3a8dd9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-topic {
            background: #43e97b;
            color: white;
        }

        .btn-topic:hover {
            background: #38d169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
        }

        .content-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .problem-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .problem-description {
            line-height: 1.8;
            color: #555;
            margin-bottom: 20px;
        }

        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .io-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .io-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .io-content {
            font-family: 'Courier New', monospace;
            background: #f1f3f5;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        .complexity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .complexity-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .complexity-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .complexity-value {
            font-size: 1.5em;
            font-family: 'Courier New', monospace;
            color: #333;
        }

        .approach-steps {
            list-style-position: inside;
            line-height: 2;
        }

        .approach-steps li {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #4facfe;
        }

        .topic-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .no-problem {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.2em;
        }

        .filter-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-label {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
        }

        .filter-input {
            padding: 10px 20px;
            font-size: 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #333;
            cursor: text;
            outline: none;
            transition: all 0.3s ease;
            min-width: 300px;
        }

        .filter-input:hover {
            border-color: #5568d3;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .filter-input:focus {
            border-color: #5568d3;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-input::placeholder {
            color: #999;
            font-style: italic;
        }

        .problem-count {
            font-size: 14px;
            color: #8b949e;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Random Problem Viewer</h1>
        
        <div class="filter-section">
            <label class="filter-label">Filter by Topic:</label>
            <input type="text" id="topicFilter" class="filter-input" 
                   list="topicList" 
                   placeholder="Type to search or select 'All Topics'..."
                   oninput="updateProblemCount()" 
                   autocomplete="off">
            <datalist id="topicList">
                <option value="All Topics">
            </datalist>
            <span class="problem-count" id="problemCount"></span>
        </div>
        
        <div class="button-group">
            <button class="btn-load" onclick="loadProblem()">Load Problem</button>
            <button class="btn-complexity" onclick="showComplexity()">Complexity</button>
            <button class="btn-approach" onclick="showApproach()">Approach</button>
            <button class="btn-topic" onclick="showTopic()">Topic</button>
        </div>

        <div id="problemSection" class="content-section">
            <div class="problem-title" id="problemTitle"></div>
            <div class="problem-description" id="problemDescription"></div>
            <div class="io-container">
                <div class="io-box">
                    <div class="io-title">📥 Sample Input</div>
                    <div class="io-content" id="sampleInput"></div>
                </div>
                <div class="io-box">
                    <div class="io-title">📤 Sample Output</div>
                    <div class="io-content" id="sampleOutput"></div>
                </div>
            </div>
        </div>

        <div id="complexitySection" class="content-section">
            <div class="section-title">⏱️ Complexity Analysis</div>
            <div class="complexity-grid">
                <div class="complexity-box">
                    <div class="complexity-label">Time Complexity</div>
                    <div class="complexity-value" id="timeComplexity"></div>
                </div>
                <div class="complexity-box">
                    <div class="complexity-label">Space Complexity</div>
                    <div class="complexity-value" id="spaceComplexity"></div>
                </div>
            </div>
        </div>

        <div id="approachSection" class="content-section">
            <div class="section-title">💡 Approach</div>
            <ol class="approach-steps" id="approachSteps"></ol>
        </div>

        <div id="topicSection" class="content-section">
            <div class="section-title">📚 Topic</div>
            <div id="topicDescription"></div>
            <div class="topic-tags" id="topicTags"></div>
        </div>
    </div>

    <script>
        // Problem data structure - will be populated with actual problems
        const problems = [
            {
                title: "Find Left Most and Right Most Index of Element",
                description: "Given a sorted array of integers A (0-indexed) of size N, find the left most and the right most index of a given integer B in the array A.\n\nReturn an array of size 2, such that:\n• First element = Left most index of B in A\n• Second element = Right most index of B in A\n\nIf B is not found in A, return [-1, -1].\n\nNote: The time complexity of your algorithm must be O(log n).",
                sampleInput: "A = [5, 7, 7, 8, 8, 10]\nB = 8",
                sampleOutput: "[3, 4]\n\nExplanation: The first occurrence of 8 is at index 3 and the last occurrence is at index 4.",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Use Binary Search twice - once to find the leftmost occurrence and once for the rightmost",
                    "For leftmost: When target is found, continue searching in the left half to find earlier occurrence",
                    "For rightmost: When target is found, continue searching in the right half to find later occurrence",
                    "Handle edge cases: element not found, single element, all elements same",
                    "Return [-1, -1] if element not found, otherwise return [leftIndex, rightIndex]"
                ],
                topic: "Binary Search on sorted arrays to find boundaries of a target element. This is a classic problem that demonstrates how binary search can be modified to find not just any occurrence, but specific occurrences (first/last) of a target value.",
                tags: ["Binary Search", "Arrays", "Sorted Array", "Search Boundaries"]
            },
            {
                title: "Search Insert Position (Lower Bound)",
                description: "You are given a sorted array A of size N and a target value B. Your task is to find the index (0-based indexing) of the target value in the array.\n\n• If the target value is present, return its index\n• If the target value is not found, return the index of least element greater than or equal to B\n• If the target value is not found and least number greater than or equal to target is also not present, return the length of array (i.e. the position where target can be placed)\n\nConstraints:\n• 1 <= N <= 10^5\n• 1 <= A[i] <= 10^5\n• 1 <= B <= 10^5\n\nTime complexity must be O(log N).",
                sampleInput: "Input 1:\nA = [1, 3, 5, 6]\nB = 5\n\nInput 2:\nA = [1, 4, 9]\nB = 3",
                sampleOutput: "Output 1: 2\n(5 is found at index 2)\n\nOutput 2: 1\n(3 is not found, smallest element >= 3 is 4 at index 1)",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Use modified Binary Search to find the lower bound (smallest index where element >= target)",
                    "Initialize low = 0, high = N-1, ans = N (default if all elements are smaller)",
                    "At each mid: if A[mid] >= B, update ans = mid and search left half (high = mid - 1)",
                    "If A[mid] < B, search right half (low = mid + 1)",
                    "The answer will be the leftmost position where we can insert B to keep array sorted"
                ],
                topic: "Binary Search - Lower Bound (Ceiling). This problem teaches finding the insertion position in a sorted array, which is equivalent to finding the lower bound or ceiling element. It's a fundamental pattern used in many advanced algorithms.",
                tags: ["Binary Search", "Lower Bound", "Sorted Array", "Search Insert Position"]
            },
            {
                title: "Single Element in Sorted Array",
                description: "Given a sorted array of integers A where every element appears twice except for one element which appears once, find and return this single element that appears only once.\n\nElements which are appearing twice are adjacent to each other.\n\nConstraints:\n• 1 <= |A| <= 100000\n• 1 <= A[i] <= 10^9\n\nNOTE: Users are expected to solve this in O(log(N)) time.",
                sampleInput: "Input 1:\nA = [1, 1, 7]\n\nInput 2:\nA = [2, 3, 3]",
                sampleOutput: "Output 1: 7\n(7 appears only once)\n\nOutput 2: 2\n(2 appears only once)",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Key insight: Before the single element, pairs start at even indices (0,1), (2,3), etc.",
                    "After the single element, pairs start at odd indices",
                    "Use Binary Search: Check if mid is at even or odd index",
                    "If mid is even and A[mid] == A[mid+1], single element is on right → low = mid + 2",
                    "If mid is even and A[mid] != A[mid+1], single element is on left → high = mid",
                    "If mid is odd, adjust accordingly. Continue until low == high"
                ],
                topic: "Binary Search on pattern recognition. This problem uses binary search not to find a target value, but to find where a pattern breaks. Before the single element, pairs align differently than after it.",
                tags: ["Binary Search", "Pattern Recognition", "Sorted Array", "XOR Alternative"]
            },
            {
                title: "Find a Peak Element",
                description: "Given an array of integers A, find and return the peak element in it.\n\nAn array element is considered a peak if it is not smaller than its neighbors. For corner elements, we need to consider only one neighbor.\n\nConstraints:\n• 1 <= |A| <= 100000\n• 1 <= A[i] <= 10^9\n\nNOTE:\n• It is guaranteed that the array contains only a single peak element\n• Users are expected to solve this in O(log(N)) time\n• The array may contain duplicate elements",
                sampleInput: "Input 1:\nA = [1, 2, 3, 4, 5]\n\nInput 2:\nA = [5, 17, 100, 11]",
                sampleOutput: "Output 1: 5\n(5 is greater than its only neighbor 4)\n\nOutput 2: 100\n(100 is greater than both neighbors 17 and 11)",
                timeComplexity: "O(log N)",
                spaceComplexity: "O(1)",
                approach: [
                    "Use Binary Search to navigate towards increasing slope",
                    "At mid, check if A[mid] > A[mid-1] and A[mid] > A[mid+1] → peak found",
                    "If A[mid] < A[mid+1], peak must be on right side → low = mid + 1",
                    "If A[mid] < A[mid-1], peak must be on left side → high = mid - 1",
                    "Handle edge cases: first and last elements (check only one neighbor)"
                ],
                topic: "Binary Search on unimodal functions. Instead of searching for a specific value, we search for a property (peak). By always moving towards the increasing slope, we're guaranteed to find a peak.",
                tags: ["Binary Search", "Peak Finding", "Unimodal", "Gradient Descent"]
            }
        ];

        let currentProblem = null;

        // Initialize topic filter on page load
        window.onload = function() {
            populateTopicFilter();
            updateProblemCount();
        };

        function populateTopicFilter() {
            const topicSet = new Set();
            problems.forEach(problem => {
                problem.tags.forEach(tag => topicSet.add(tag));
            });
            
            const topicList = document.getElementById('topicList');
            const sortedTopics = Array.from(topicSet).sort();
            
            sortedTopics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                topicList.appendChild(option);
            });
        }

        function getFilteredProblems() {
            const selectedTopic = document.getElementById('topicFilter').value.trim();
            
            if (selectedTopic === '' || selectedTopic.toLowerCase() === 'all topics') {
                return problems;
            }
            
            return problems.filter(problem => 
                problem.tags.some(tag => tag.toLowerCase().includes(selectedTopic.toLowerCase()))
            );
        }

        function updateProblemCount() {
            const filteredProblems = getFilteredProblems();
            const countElement = document.getElementById('problemCount');
            countElement.textContent = `(${filteredProblems.length} problem${filteredProblems.length !== 1 ? 's' : ''})`;
        }

        function loadProblem() {
            const filteredProblems = getFilteredProblems();
            
            if (filteredProblems.length === 0) {
                alert("No problems available for the selected topic.");
                return;
            }

            // Select a random problem from filtered list
            const randomIndex = Math.floor(Math.random() * filteredProblems.length);
            currentProblem = filteredProblems[randomIndex];

            // Update problem section
            document.getElementById('problemTitle').textContent = currentProblem.title;
            document.getElementById('problemDescription').textContent = currentProblem.description;
            document.getElementById('sampleInput').textContent = currentProblem.sampleInput;
            document.getElementById('sampleOutput').textContent = currentProblem.sampleOutput;

            // Show problem section and hide others
            hideAllSections();
            document.getElementById('problemSection').classList.add('active');
        }

        function showComplexity() {
            if (!currentProblem) {
                alert("Please load a problem first!");
                return;
            }

            document.getElementById('timeComplexity').textContent = currentProblem.timeComplexity;
            document.getElementById('spaceComplexity').textContent = currentProblem.spaceComplexity;

            hideInfoSections();
            document.getElementById('problemSection').classList.add('active');
            document.getElementById('complexitySection').classList.add('active');
        }

        function showApproach() {
            if (!currentProblem) {
                alert("Please load a problem first!");
                return;
            }

            const approachSteps = document.getElementById('approachSteps');
            approachSteps.innerHTML = '';
            
            currentProblem.approach.forEach(step => {
                const li = document.createElement('li');
                li.textContent = step;
                approachSteps.appendChild(li);
            });

            hideInfoSections();
            document.getElementById('problemSection').classList.add('active');
            document.getElementById('approachSection').classList.add('active');
        }

        function showTopic() {
            if (!currentProblem) {
                alert("Please load a problem first!");
                return;
            }

            document.getElementById('topicDescription').textContent = currentProblem.topic;
            
            const topicTags = document.getElementById('topicTags');
            topicTags.innerHTML = '';
            
            currentProblem.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.textContent = tag;
                topicTags.appendChild(span);
            });

            hideInfoSections();
            document.getElementById('problemSection').classList.add('active');
            document.getElementById('topicSection').classList.add('active');
        }

        function hideInfoSections() {
            document.getElementById('complexitySection').classList.remove('active');
            document.getElementById('approachSection').classList.remove('active');
            document.getElementById('topicSection').classList.remove('active');
        }

        function hideAllSections() {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
        }
    </script>
</body>
</html>
